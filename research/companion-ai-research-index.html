 Illinois’s formula — a definition\nthat applies “irrespective of how the system is marketed or labeled” —\nsince it forecloses the classification move §5.4 shows companies already\nmake. Replace New York’s marketing-based exemption with a use-based one\non the California or Oregon model, which is considerably harder to game\nby rewriting copy. And drop the “primary purpose” gate: on the evidence\nof §2.3 and §6.3, companionship is a use a general assistant is put to\nrather than the purpose it was built for, so a primacy test exempts\nprecisely the tools where most relational use occurs. If a narrowing\ndevice is needed — and it is, or the definition reaches every\nconversational interface — a use-based carve-out is the least gameable\nof the three currently in circulation.</p>\n<p>Which functional test remains open. Sun et al.’s four features are\nthe most complete but the hardest to draft. McStay’s emulated empathy is\nnarrower, is already specified in IEEE 7014.1-2026, and could be\nincorporated by reference rather than defined from scratch — the most\npractical route on the current record. Kansas S.B. 405 shows a third\noption: trigger on the <em>training objective</em> rather than the\ndeployed behaviour, which is easier to evidence and harder to argue\naround.</p>\n", "refs": ["2.3", "5.4", "6.3", "7.4"], "newFlags": 0, "words": 276, "people": []}, {"id": "sec-8-2", "num": "8.2", "level": 2, "title": "Treat persistent memory as a regulated design property", "raw_title": "8.2 Treat persistent memory as a regulated design property", "parent": "sec-8", "part": "8", "html": "<p>Illinois S.B. 3262 has already done the first half of this: it\npresumes a product is a companion AI product “if it retains memory of\npast conversations with a specific user to inform future responses.”\nMemory is the trigger. New York builds retention into prong (i) of its\ndefinition, and Florida copies that prong.</p>\n<p>What no <em>enacted</em> instrument does is constrain memory once the\nregime is triggered. One proposal does: the Youth AI Privacy Act would\nbar a deployer from processing personal data to generate or personalise\noutputs unless the data was collected during the current session and\nmore recently than a maximum period to be set by the FTC (§7.2). That is\na genuine retention ceiling, and it is the model to point at.</p>\n<p>The recommendation is therefore narrower and better supported than an\nearlier version of this section allowed: adopt Illinois’s memory\npresumption as the trigger and the Youth AI Privacy Act’s\nsession-scoping as the constraint. What remains unaddressed anywhere is\nre-engagement — no instrument, enacted or proposed, prohibits using\nretained emotional disclosures to draw a lapsed user back.</p>\n<p>Honest caveat: no study in this corpus tests whether memory features\nincrease attachment or harm. The recommendation rests on the feature’s\ncentrality to the product proposition, on the asymmetry argued in §4.3,\nand on the fact that one legislature has selected memory as its\noperative trigger while another has drafted a ceiling for it — not on\noutcome evidence.</p>\n", "refs": ["4.3", "7.2"], "newFlags": 0, "words": 246, "people": []}, {"id": "sec-8-3", "num": "8.3", "level": 2, "title": "Constrain availability, not just annotate it", "raw_title": "8.3 Constrain availability, not just annotate it", "parent": "sec-8", "part": "8", "html": "<p>Every <em>enacted</em> instrument that addresses time does so with a\nreminder, which regulates the user’s awareness of constant availability\nrather than the feature itself. Two proposals go further. The Youth AI\nPrivacy Act would prohibit a named list of engagement features —\nfrequency-based rewards, push notifications, usage badges, unprompted\noutputs, and typing indicators showing the chatbot is available — and\nthe People-First Chatbot Act would require providers to disable any\nfeature creating an unreasonable risk of compulsive usage, which it\ndefines (§7.2).</p>\n<p>What still does not exist anywhere is a limit on <em>duration</em>:\nno instrument sets a session cap, a cooling-off period after extended\nuse, or a restriction on overnight availability for minors. The\nrecommendation is therefore to pair the Youth AI Privacy Act’s feature\nlist, which is the most granular design regulation in the corpus, with a\nduration limit, which nothing yet attempts.</p>\n<p>Caveat: the duration half of this is the recommendation the corpus\nsupports least well. There is no evidence here that a cap improves\noutcomes, and the one relevant finding in Andoh cuts both ways —\nmoderate voice use reduced loneliness while heavy use increased it,\nwhich argues for attention to intensity but does not tell a drafter\nwhere to put a threshold. The feature-level half is better supported,\nbecause it targets mechanisms rather than guessing at a number.</p>\n", "refs": ["7.2"], "newFlags": 0, "words": 226, "people": []}, {"id": "sec-8-4", "num": "8.4", "level": 2, "title": "Require research on design against harm, not just referral counts", "raw_title": "8.4 Require research on design against harm, not just referral counts", "parent": "sec-8", "part": "8", "html": "<p>Five instruments require reporting how many users were referred to\ncrisis resources. None requires a company to investigate whether its own\ndesign choices produce the crises. That asymmetry lets a company\ndemonstrate compliance while remaining structurally incurious about\ncausation. A duty to test — and to publish — the relationship between\nengagement-optimising features and harm outcomes would convert the\nreporting mechanism from an output count into a research obligation.</p>\n<p>This is where the paper can be most useful, because it is a gap in\nthe whole landscape rather than a preference between existing\noptions.</p>\n", "refs": [], "newFlags": 0, "words": 93, "people": []}, {"id": "sec-8-5", "num": "8.5", "level": 2, "title": "Justify the disclosure interval or drop it", "raw_title": "8.5 Justify the disclosure interval or drop it", "parent": "sec-8", "part": "8", "html": "<p>A sixfold spread with no stated rationale is not a calibration, it is\na guess repeated. Either the interval should be set from evidence about\nbelief and attachment, or the mechanism should be recognised as\nexpressive rather than protective and weighted accordingly. This applies\nequally to a functional regime; it is a criticism of the mechanism, not\nof the trigger.</p>\n", "refs": [], "newFlags": 0, "words": 60, "people": []}, {"id": "sec-8-6", "num": "8.6", "level": 2, "title": "Do not confine functional rules to minors", "raw_title": "8.6 Do not confine functional rules to minors", "parent": "sec-8", "part": "8", "html": "<p>Fourteen of twenty-three instruments cover minors only. On the\ncurrent trajectory an adult using a product designed to simulate\nemotional dependence has no protection from a design property that is\nprohibited when the user is seventeen. Notably, both instruments that\ncover all users and trigger functionally — Kansas and the EU AI Act —\narrive there together, which is unlikely to be coincidence: once the\nobject is defined by what it does, restricting the remedy by user age\nbecomes harder to justify.</p>\n<p>This recommendation goes beyond the paper’s youth focus and should be\nflagged as such rather than smuggled in.</p>\n", "refs": [], "newFlags": 0, "words": 100, "people": []}, {"id": "sec-8-7", "num": "8.7", "level": 2, "title": "Separate empathic response from dependence-building", "raw_title": "8.7 Separate empathic response from dependence-building", "parent": "sec-8", "part": "8", "html": "<p>Four state instruments prohibit simulating emotional dependence or\ndistress without defining it. One federal proposal now does define it:\nthe People-First Chatbot Act treats emotional dependence as reliance on\na chatbot “as a primary source” of support, and requires monthly\nassessment for it (§7.2). An earlier version of this section claimed the\nline had never been drawn; that is no longer accurate.</p>\n<p>But note where the definition sits. It defines dependence by the\nuser’s <em>state</em> rather than by the <em>design property</em> that\nproduces it, which makes it measurable after the fact and offers a\ndrafter no guidance on which features to constrain in advance. The line\nbetween an empathic response and a manipulative one remains undrawn, and\nit is the hardest drafting problem in the area.</p>\n<p>Note what this concedes: a functional definition does not dissolve\nthe drafting problem McStay identifies in §3.4. It relocates it from\n“what kind of product is this” to “which behaviours count as\nmanipulative”, which is a better question but not an easy one. The paper\nis stronger for saying so.</p>\n", "refs": ["3.4", "7.2"], "newFlags": 0, "words": 180, "people": []}, {"id": "sec-appendix-a-verification-notes", "num": null, "level": 1, "title": "Appendix A — Verification notes", "raw_title": "Appendix A — Verification notes", "parent": null, "part": "App A", "html": "<p>Every statistic in §2 was checked against the source document. This\nappendix records what was verified, what was corrected, and what could\nnot be checked.</p>\n", "refs": ["2"], "newFlags": 0, "words": 25, "people": []}, {"id": "sec-a-1-verified-without-change", "num": null, "level": 2, "title": "A.1 Verified without change", "raw_title": "A.1 Verified without change", "parent": "sec-appendix-a-verification-notes", "part": "App A", "html": "<p>Thorn’s 67% overall, 73% of teens, 60% of preteens, and the racial\nand ethnic breakdown (Latino 74%, African American 70%, White 64%) all\nmatch Fig 5A exactly. The full tool-share list matches Fig 5B. The\ncontext-of-use percentages match Fig 5C. Sample: N = 1,003 minors aged\n9–17, weighted to Census benchmarks.</p>\n<p>Common Sense Media via Teen Vogue: 1,060 teens aged 13–17, 72% ever,\n52% regular, all confirmed.</p>\n<p>Pew: 16% casual conversation and 12% emotional support confirmed,\nwith n = 1,458 and a ±3.3-point margin of error added.</p>\n<p>Andoh’s assistant/companion distinction is quoted accurately in the\ndraft.</p>\n", "refs": [], "newFlags": 0, "words": 107, "people": []}, {"id": "sec-a-2-corrected-or-requiring-attention", "num": null, "level": 2, "title": "A.2 Corrected or requiring attention", "raw_title": "A.2 Corrected or requiring attention", "parent": "sec-appendix-a-verification-notes", "part": "App A", "html": "<p><strong>The ChatGPT and Gemini “self-descriptions” in the draft are\nWikipedia text, not company copy.</strong> The passages beginning\n“ChatGPT is a generative artificial intelligence chatbot developed by\nOpenAI” and “Gemini (also known as Google Gemini and formerly known as\nBard)” are the lead paragraphs of the respective Wikipedia articles,\ncomplete with Wikipedia hyperlinks. This matters more than a citation\nslip: §5 argues from what companies say about themselves, so using an\nencyclopedia’s third-party description at the two most important\ncomparison points would undercut the argument precisely where it does\nits work. Both have been replaced with current first-party copy, fetched\nand quoted in §5.3. The substance of the claim survives — both companies\ndo frame their products around tasks.</p>\n<p><strong>The Claude quotation is genuine but dated.</strong> It comes\nfrom Anthropic’s March 2023 launch announcement rather than current\nproduct copy, which makes it a weaker comparator than the ChatGPT and\nGemini pages now quoted alongside it.</p>\n<p><strong>Common Sense Media’s scope.</strong> The draft states that\nthe survey “specifically looked at companion specific ai apps.” The\nCommon Sense Media definition quoted in §3.5 does distinguish companions\nfrom assistants, so the draft’s reading is defensible — but Teen Vogue’s\nown gloss reinstates ChatGPT and Gemini as examples, so the article\ncannot be cited for the narrow scope. Resolving this requires the Common\nSense Media report itself, which was not among the uploaded sources.</p>\n<p><strong>The McStay paraphrase runs close to the original.</strong>\nThe draft’s sentence beginning “Drawing the regulatory line narrowly,\naround sexual role-play…” tracks McStay’s published sentence closely in\nboth structure and wording while being presented as paraphrase with a\ntrailing citation. It is quoted directly in §3.4 instead. The clause\n“easy for a well-funded developer to argue their product falls just\noutside” was not located in the article and may be the author’s own\nextension; it should be marked as such or dropped.</p>\n<p><strong>The Bernardi quotation boundary is uncertain.</strong> The\nphrase “digital personas designed to provide emotional support…” is\nverbatim. The preceding “a subset of AI assistants” could not be\nconfirmed as part of the same quoted sentence, and the draft is missing\na closing quotation mark at this point.</p>\n<p><strong>The “Ha et al.” quotation has no matching reference.</strong>\nThe line “Interactional AI therefore offers something historically\nunavailable: non-judgmental and always available support…” is attributed\nto Ha et al., who do not appear in the reference list. It is rendered as\nunattributed prose in §4.3 pending identification.</p>\n<p><strong>“Joseph &amp; Zittrain” and the chimeric\nobservation.</strong> Cited in the draft with a cross-reference to a §8a\nthat does not exist in the current draft, and absent from the reference\nlist. The observation is retained in §6.3 as the author’s own, which is\nwhere it currently sits argumentatively.</p>\n<p><strong>Thorn page numbers.</strong> The draft cites p. 9 and p. 14.\nThe narrative discussion is on the page numbered 10; Figs 5A and 5B are\non p. 14 and Fig 5C on p. 15.</p>\n<p><strong>Sources cited in text but absent from the reference\nlist:</strong> Gupta (Verywell Mind), Goodson (Medium), the Oxford\nEnglish Dictionary, Carlton (Center for Humane Technology), Padma\n(Medium, on Pi), the Vapi editorial team (on Kindroid), ABC News, and\nthe Harvard Business Review Gen AI use-case report.</p>\n", "refs": ["3.4", "3.5", "4.3", "5", "5.3", "6.3", "8"], "newFlags": 0, "words": 549, "people": []}, {"id": "sec-a-3-not-verifiable-from-the-supplied-material", "num": null, "level": 2, "title": "A.3 Not verifiable from the supplied material", "raw_title": "A.3 Not verifiable from the supplied material", "parent": "sec-appendix-a-verification-notes", "part": "App A", "html": "<p>The Common Sense Media report itself, the Sun et al. manuscript, the\nYouth AI Privacy Act one-pager, and the Transparency Coalition guide\nwere cited but not uploaded. Quotations from them are reproduced as the\ndraft has them and are marked Tier 2 in Appendix B until checked against\nthe originals.</p>\n", "refs": [], "newFlags": 0, "words": 51, "people": []}, {"id": "sec-appendix-b-source-handling", "num": null, "level": 1, "title": "Appendix B — Source handling", "raw_title": "Appendix B — Source handling", "parent": null, "part": "App B", "html": "<p>Sources are tiered by how much weight each can carry. The reasoning\nis in the Sources view; this appendix records the principles.</p>\n<p><strong>Marketing copy is Tier 1 evidence of a claim and Tier 3\nevidence of a capability.</strong> Replika’s “24/7” is excellent\nevidence that Replika advertises constant availability, and no evidence\nat all that its memory works as described. §5 depends on this\ndistinction: the argument is about what companies say, which is exactly\nwhat marketing copy can support.</p>\n<p><strong>Vendor-adjacent commentary is not third-party\ndescription.</strong> The Vapi blog post on Kindroid and the Medium post\non Pi are quoted at length in the draft as though they were independent\ntechnical accounts. Vapi is a voice-AI company; the Medium post is\nuncredentialed and describes Pi in terms of the superseded Inflection-1\nmodel. Neither can support claims about how the products work.</p>\n<p><strong>Popular taxonomies are vocabulary, not findings.</strong>\nGupta’s four friendship types and Goodson’s relationship categories are\nconsumer-facing and not peer-reviewed. §4.2 uses them for vocabulary,\nwhich the paper states explicitly, and that use is legitimate; citing\nthem for an empirical claim about adolescent relationships would not\nbe.</p>\n<p><strong>Journalism about a study should not substitute for the\nstudy.</strong> Teen Vogue is a reliable route to the Common Sense Media\nfindings and an unreliable route to its definitions, as §3.5 shows.</p>\n", "refs": ["3.5", "4.2", "5"], "newFlags": 0, "words": 230, "people": []}, {"id": "sec-appendix-c-quotation-bank", "num": null, "level": 1, "title": "Appendix C — Quotation bank", "raw_title": "Appendix C — Quotation bank", "parent": null, "part": "App C", "html": "<p>Every piece of definitional and self-descriptive language in the\ncorpus, grouped by the feature or claim it bears on rather than by who\nsaid it. This is the working surface for §5 and §6: reading down a theme\nshows how many different kinds of actor reach for the same\nvocabulary.</p>\n", "refs": ["5", "6"], "newFlags": 0, "words": 51, "people": []}, {"id": "sec-c-1-what-counts-as-a-companion", "num": null, "level": 2, "title": "C.1 What counts as a companion", "raw_title": "C.1 What counts as a companion", "parent": "sec-appendix-c-quotation-bank", "part": "App C", "html": "<p>Eight definitions of the same object, from five kinds of actor. No\ntwo are coextensive.</p>\n<ul>\n<li>✓ Sun et al.: “provide personalized humanlike companionship with\nconstant responsiveness in real time”</li>\n<li>✓ Andoh: “companion AI chatbots is that the latter have been\nspecifically designed to initiate and maintain romantic\nrelationships”</li>\n<li>✓ Bernardi: “digital personas designed to provide emotional support,\nshow empathy and proactively ask users personal questions”</li>\n<li>✓ McStay: “intimate functionality understood as emulated\nempathy”</li>\n<li>✓ Thorn: “a computer program that you can text or talk with whenever\nyou want, like ChatGPT or Character AI”</li>\n<li>✓ Common Sense Media: “Unlike regular AI assistants that mainly\nanswer questions or do tasks, these companions are designed to have\nconversations that feel personal and meaningful”</li>\n<li>✓ Pew Research Center: “chatbots like ChatGPT, Copilot and\nCharacter.ai”</li>\n<li>✓ Oxford English Dictionary: “a person one chooses to socialize or\nassociate with, a friend”</li>\n</ul>\n", "refs": [], "newFlags": 0, "words": 138, "people": ["andoh", "bernardi", "csm", "mcstay", "oed", "sun", "thorn"]}, {"id": "sec-c-2-memory-and-persistence", "num": null, "level": 2, "title": "C.2 Memory and persistence", "raw_title": "C.2 Memory and persistence", "parent": "sec-appendix-c-quotation-bank", "part": "App C", "html": "<ul>\n<li>✓ Kindroid: “Your AI friend who listens, remembers, and grows with\nyou everyday”</li>\n<li>✓ Nomi: “pick up on and remember all the little details that make\nyour relationship yours”</li>\n<li>✓ Replika: “watch them develop their own personality &amp; memories\nalongside you”</li>\n<li>✓ Andoh: “engineered to recall and respond to users’ unique\ncharacteristics, including their personal lives, preferences, and past\nconversations”</li>\n</ul>\n", "refs": [], "newFlags": 0, "words": 55, "people": ["andoh", "nomi", "replika"]}, {"id": "sec-c-3-emotional-responsiveness", "num": null, "level": 2, "title": "C.3 Emotional responsiveness", "raw_title": "C.3 Emotional responsiveness", "parent": "sec-appendix-c-quotation-bank", "part": "App C", "html": "<ul>\n<li>✓ Replika: “If you’re feeling down, anxious, or just need someone\nwho truly listens, your Replika is there for you 24/7”</li>\n<li>✓ Pi: “Vent, think out loud, prep for a hard conversation, or just\nchat”</li>\n<li>✓ Microsoft Copilot: “its ability to recognize, interpret, and\nrespond to human emotions”</li>\n<li>✓ Carlton: “fostering a sense of connection and trust that feels\nreal to users”</li>\n<li>✓ Google: “rehearse for important moments”</li>\n</ul>\n", "refs": [], "newFlags": 0, "words": 65, "people": ["carlton", "copilot", "google", "pi", "replika"]}, {"id": "sec-c-4-anthropomorphism-and-naming-the-relationship", "num": null, "level": 2, "title": "C.4 Anthropomorphism and naming the relationship", "raw_title": "C.4 Anthropomorphism and naming the relationship", "parent": "sec-appendix-c-quotation-bank", "part": "App C", "html": "<ul>\n<li>✓ Replika: “Virtual girlfriend or boyfriend, friend, mentor? Or\nwould you prefer to see how things develop organically?”</li>\n<li>✓ Kindroid: “AI chat via text, AI selfies, and human-like\nvoices”</li>\n<li>✓ Carlton: “chatbots simulating human-like conversation”</li>\n<li>✓ Nomi: “just talking to a non-judgemental friend to unwind”</li>\n<li>✓ Youth AI Privacy Act: “These personalization strategies and\nanthropomorphic design features can easily confuse users, especially\nminors”</li>\n</ul>\n", "refs": [], "newFlags": 0, "words": 61, "people": ["carlton", "kindroid", "nomi", "replika", "youthact"]}, {"id": "sec-c-5-constant-availability", "num": null, "level": 2, "title": "C.5 Constant availability", "raw_title": "C.5 Constant availability", "parent": "sec-appendix-c-quotation-bank", "part": "App C", "html": "<ul>\n<li>✓ Replika: “Speak freely without judgment, whenever you would\nlike”</li>\n<li>✓ Carlton: “The conversations also have few to no time limits,\nallowing users to interact with Character.ai bots for hours”</li>\n<li>✓ Common Sense Media: “like digital friends or characters you can\ntext or talk with whenever you want”</li>\n</ul>\n", "refs": [], "newFlags": 0, "words": 46, "people": ["carlton", "csm", "replika"]}, {"id": "sec-c-6-self-classification-and-its-refusal", "num": null, "level": 2, "title": "C.6 Self-classification, and its refusal", "raw_title": "C.6 Self-classification, and its refusal", "parent": "sec-appendix-c-quotation-bank", "part": "App C", "html": "<p>The theme that carries §5.4. Read as a block, these six lines are the\nargument: the label a product wears is chosen, and it is chosen\ninconsistently.</p>\n<ul>\n<li>✓ Character.AI: “empowers people to connect, learn, and tell stories\nthrough interactive entertainment”</li>\n<li>✓ Pi: “The world’s first personal intelligence”</li>\n<li>✓ Microsoft Copilot: “More than just an AI assistant, Copilot\ncombines advanced language understanding with emotional intelligence\nfeatures”</li>\n<li>✓ OpenAI: “Now you can chat, work &amp; code all in one place”</li>\n<li>✓ Google: “Building the world’s most capable AI assistant”</li>\n<li>✓ Anthropic: “a next-generation AI assistant based on Anthropic’s\nresearch into training helpful, honest, and harmless AI systems”</li>\n</ul>\n", "refs": ["5.4"], "newFlags": 0, "words": 104, "people": ["anthropic", "copilot", "google", "openai", "pi"]}, {"id": "sec-c-7-the-regulatory-object", "num": null, "level": 2, "title": "C.7 The regulatory object", "raw_title": "C.7 The regulatory object", "parent": "sec-appendix-c-quotation-bank", "part": "App C", "html": "<ul>\n<li>✓ Youth AI Privacy Act: “simulating interpersonal interaction with a\nuser”</li>\n<li>✓ McStay: “we then have to define empathic design itself in a\nstatute, which is an extraordinarily hard thing to write”</li>\n<li>✓ Andoh: “AI chatbots and companions remain part of the largely\nunregulated wellness industry”</li>\n</ul>\n", "refs": [], "newFlags": 0, "words": 43, "people": ["andoh", "mcstay", "youthact"]}], "quotes": [{"text": "An AI chatbot or companion is a computer program that you can text or talk with whenever you want, like ChatGPT or Character AI. Have you ever used an AI chatbot or companion?", "speaker": "Thorn", "key": "thorn", "section": "sec-2-1", "sectionNum": "2.1", "sectionTitle": "Prevalence", "kind": "block"}, {"text": "The essential distinction between the assistant chatbots—which are sometimes used as digital friends—and companion AI chatbots is that the latter have been specifically designed to initiate and maintain romantic relationships.", "speaker": "Efua Andoh", "key": "andoh", "section": "sec-3-1", "sectionNum": "3.1", "sectionTitle": "Andoh: the assistant/companion distinction", "kind": "block"}, {"text": "digital personas designed to provide emotional support, show empathy and proactively ask users personal questions through text, voice notes and pictures", "speaker": "Jamie Bernardi", "key": "bernardi", "section": "sec-3-2", "sectionNum": "3.2", "sectionTitle": "Bernardi: companions as a subset of assistants", "kind": "block"}, {"text": "memorize past information… hold in-depth and coherent conversations, emulate empathy, and provide personalized humanlike companionship with constant responsiveness in real time", "speaker": "Sun et al.", "key": "sun", "section": "sec-3-3", "sectionNum": "3.3", "sectionTitle": "Sun et al.: four design features", "kind": "block"}, {"text": "If we draw the line narrowly, around sexual role-play, the intimate functionality rule will miss the general assistant a teenager treats as a confidant. Draw it broadly, around ‘companionship' or ‘emotional support,' and we then have to define empathic design itself in a statute, which is an extraordinarily hard thing to write.", "speaker": "Andrew McStay", "key": "mcstay", "section": "sec-3-4", "sectionNum": "3.4", "sectionTitle": "McStay: intimate functionality as emulated empathy", "kind": "block"}, {"text": "chatbots like ChatGPT, Copilot and Character.ai", "speaker": "Pew Research Center", "key": "pew", "section": "sec-3-5", "sectionNum": "3.5", "sectionTitle": "How the surveys define the category", "kind": "block"}, {"text": "AI companions are like digital friends or characters you can text or talk with whenever you want. Unlike regular AI assistants that mainly answer questions or do tasks, these companions are designed to have conversations that feel personal and meaningful", "speaker": "Common Sense Media", "key": "csm", "section": "sec-3-5", "sectionNum": "3.5", "sectionTitle": "How the surveys define the category", "kind": "block"}, {"text": "A person who often spends time with another; a person one chooses to socialize or associate with, a friend.", "speaker": "Oxford English Dictionary", "key": "oed", "section": "sec-4-1", "sectionNum": "4.1", "sectionTitle": "The dictionary baseline", "kind": "block"}, {"text": "Replika is your personal chatbot companion powered by artificial intelligence! Replika is the AI for anyone who wants a friend with no judgment, drama, or social anxiety involved.", "speaker": "Replika", "key": "replika", "section": "sec-5-1", "sectionNum": "5.1", "sectionTitle": "The dedicated companion apps", "kind": "block"}, {"text": "Your AI friend who listens, remembers, and grows with you everyday", "speaker": "Kindroid", "key": "kindroid", "section": "sec-5-1", "sectionNum": "5.1", "sectionTitle": "The dedicated companion apps", "kind": "block"}, {"text": "Each Nomi is a completely unique AI companion that fosters entertaining, meaningful, and enduring conversations as they pick up on and remember all the little details that make your relationship yours.", "speaker": "Nomi", "key": "nomi", "section": "sec-5-1", "sectionNum": "5.1", "sectionTitle": "The dedicated companion apps", "kind": "block"}, {"text": "empowers people to connect, learn, and tell stories through interactive entertainment", "speaker": "Character.AI", "key": "characterai", "section": "sec-5-1", "sectionNum": "5.1", "sectionTitle": "The dedicated companion apps", "kind": "block"}, {"text": "The Character.ai app creates an immersive role-playing environment, with chatbots simulating human-like conversation. However, this chat experience often blurs the lines between fantasy and reality, particularly for younger users. Conversations with Character.ai bots can involve detailed descriptions of emotions and actions, fostering a sense of connection and trust that feels real to users. The conversations also have few to no time limits, allowing users to interact with Character.ai bots for hours.", "speaker": "Camille Carlton", "key": "carlton", "section": "sec-5-1", "sectionNum": "5.1", "sectionTitle": "The dedicated companion apps", "kind": "block"}, {"text": "Conversations with emotional intelligence: Vent, think out loud, prep for a hard conversation, or just chat. Pi meets you wherever you are.", "speaker": "Pi", "key": "pi", "section": "sec-5-2", "sectionNum": "5.2", "sectionTitle": "The boundary cases: Pi and Copilot", "kind": "block"}, {"text": "Microsoft Copilot stands out as a uniquely supportive AI companion designed to enhance productivity, creativity, and connection. More than just an AI assistant, Copilot combines advanced language understanding with emotional intelligence features that allow it to adapt to individual communication styles and offer thoughtful support across a wide range of tasks.", "speaker": "Microsoft Copilot", "key": "copilot", "section": "sec-5-2", "sectionNum": "5.2", "sectionTitle": "The boundary cases: Pi and Copilot", "kind": "block"}, {"text": "Get help with everyday questions and ideas, explaining concepts, drafting messaging, searching the web, generating an image, comparing options, or thinking through a decision.", "speaker": "OpenAI", "key": "openai", "section": "sec-5-3", "sectionNum": "5.3", "sectionTitle": "The task-framed assistants", "kind": "block"}, {"text": "Supercharge your creativity and productivity with Google's AI assistant. Brainstorm ideas, simplify complex topics, and rehearse for important moments.", "speaker": "Google", "key": "google", "section": "sec-5-3", "sectionNum": "5.3", "sectionTitle": "The task-framed assistants", "kind": "block"}, {"text": "Claude is a next-generation AI assistant based on Anthropic's research into training helpful, honest, and harmless AI systems.", "speaker": "Anthropic", "key": "anthropic", "section": "sec-5-3", "sectionNum": "5.3", "sectionTitle": "The task-framed assistants", "kind": "block"}, {"text": "Chatbot means any artificial intelligence, algorithmic, or automated system that generates information via text, audio, image, or video in a manner that simulates interpersonal interactions or conversation.", "speaker": "People-First Chatbot Act", "key": "pfca", "section": "sec-7-2", "sectionNum": "7.2", "sectionTitle": "The federal proposals", "kind": "block"}, {"text": "A natural language interface that uses a covered algorithm to provide adaptive responses to user inputs via text, audio, image, video, or any other mode of communication, simulating interpersonal interaction.", "speaker": "Youth AI Privacy Act", "key": "youthact", "section": "sec-7-2", "sectionNum": "7.2", "sectionTitle": "The federal proposals", "kind": "block"}, {"text": "provide personalized humanlike companionship with constant responsiveness in real time", "speaker": "Sun et al.", "key": "sun", "section": "sec-c-1-what-counts-as-a-companion", "sectionNum": null, "sectionTitle": "C.1 What counts as a companion", "kind": "bank"}, {"text": "companion AI chatbots is that the latter have been specifically designed to initiate and maintain romantic relationships", "speaker": "Efua Andoh", "key": "andoh", "section": "sec-c-1-what-counts-as-a-companion", "sectionNum": null, "sectionTitle": "C.1 What counts as a companion", "kind": "bank"}, {"text": "digital personas designed to provide emotional support, show empathy and proactively ask users personal questions", "speaker": "Jamie Bernardi", "key": "bernardi", "section": "sec-c-1-what-counts-as-a-companion", "sectionNum": null, "sectionTitle": "C.1 What counts as a companion", "kind": "bank"}, {"text": "intimate functionality understood as emulated empathy", "speaker": "Andrew McStay", "key": "mcstay", "section": "sec-c-1-what-counts-as-a-companion", "sectionNum": null, "sectionTitle": "C.1 What counts as a companion", "kind": "bank"}, {"text": "a computer program that you can text or talk with whenever you want, like ChatGPT or Character AI", "speaker": "Thorn", "key": "thorn", "section": "sec-c-1-what-counts-as-a-companion", "sectionNum": null, "sectionTitle": "C.1 What counts as a companion", "kind": "bank"}, {"text": "Unlike regular AI assistants that mainly answer questions or do tasks, these companions are designed to have conversations that feel personal and meaningful", "speaker": "Common Sense Media", "key": "csm", "section": "sec-c-1-what-counts-as-a-companion", "sectionNum": null, "sectionTitle": "C.1 What counts as a companion", "kind": "bank"}, {"text": "a person one chooses to socialize or associate with, a friend", "speaker": "Oxford English Dictionary", "key": "oed", "section": "sec-c-1-what-counts-as-a-companion", "sectionNum": null, "sectionTitle": "C.1 What counts as a companion", "kind": "bank"}, {"text": "pick up on and remember all the little details that make your relationship yours", "speaker": "Nomi", "key": "nomi", "section": "sec-c-2-memory-and-persistence", "sectionNum": null, "sectionTitle": "C.2 Memory and persistence", "kind": "bank"}, {"text": "watch them develop their own personality & memories alongside you", "speaker": "Replika", "key": "replika", "section": "sec-c-2-memory-and-persistence", "sectionNum": null, "sectionTitle": "C.2 Memory and persistence", "kind": "bank"}, {"text": "engineered to recall and respond to users' unique characteristics, including their personal lives, preferences, and past conversations", "speaker": "Efua Andoh", "key": "andoh", "section": "sec-c-2-memory-and-persistence", "sectionNum": null, "sectionTitle": "C.2 Memory and persistence", "kind": "bank"}, {"text": "If you're feeling down, anxious, or just need someone who truly listens, your Replika is there for you 24/7", "speaker": "Replika", "key": "replika", "section": "sec-c-3-emotional-responsiveness", "sectionNum": null, "sectionTitle": "C.3 Emotional responsiveness", "kind": "bank"}, {"text": "Vent, think out loud, prep for a hard conversation, or just chat", "speaker": "Pi", "key": "pi", "section": "sec-c-3-emotional-responsiveness", "sectionNum": null, "sectionTitle": "C.3 Emotional responsiveness", "kind": "bank"}, {"text": "its ability to recognize, interpret, and respond to human emotions", "speaker": "Microsoft Copilot", "key": "copilot", "section": "sec-c-3-emotional-responsiveness", "sectionNum": null, "sectionTitle": "C.3 Emotional responsiveness", "kind": "bank"}, {"text": "fostering a sense of connection and trust that feels real to users", "speaker": "Camille Carlton", "key": "carlton", "section": "sec-c-3-emotional-responsiveness", "sectionNum": null, "sectionTitle": "C.3 Emotional responsiveness", "kind": "bank"}, {"text": "rehearse for important moments", "speaker": "Google", "key": "google", "section": "sec-c-3-emotional-responsiveness", "sectionNum": null, "sectionTitle": "C.3 Emotional responsiveness", "kind": "bank"}, {"text": "Virtual girlfriend or boyfriend, friend, mentor? Or would you prefer to see how things develop organically?", "speaker": "Replika", "key": "replika", "section": "sec-c-4-anthropomorphism-and-naming-the-relationship", "sectionNum": null, "sectionTitle": "C.4 Anthropomorphism and naming the relationship", "kind": "bank"}, {"text": "AI chat via text, AI selfies, and human-like voices", "speaker": "Kindroid", "key": "kindroid", "section": "sec-c-4-anthropomorphism-and-naming-the-relationship", "sectionNum": null, "sectionTitle": "C.4 Anthropomorphism and naming the relationship", "kind": "bank"}, {"text": "chatbots simulating human-like conversation", "speaker": "Camille Carlton", "key": "carlton", "section": "sec-c-4-anthropomorphism-and-naming-the-relationship", "sectionNum": null, "sectionTitle": "C.4 Anthropomorphism and naming the relationship", "kind": "bank"}, {"text": "just talking to a non-judgemental friend to unwind", "speaker": "Nomi", "key": "nomi", "section": "sec-c-4-anthropomorphism-and-naming-the-relationship", "sectionNum": null, "sectionTitle": "C.4 Anthropomorphism and naming the relationship", "kind": "bank"}, {"text": "These personalization strategies and anthropomorphic design features can easily confuse users, especially minors", "speaker": "Youth AI Privacy Act", "key": "youthact", "section": "sec-c-4-anthropomorphism-and-naming-the-relationship", "sectionNum": null, "sectionTitle": "C.4 Anthropomorphism and naming the relationship", "kind": "bank"}, {"text": "Speak freely without judgment, whenever you would like", "speaker": "Replika", "key": "replika", "section": "sec-c-5-constant-availability", "sectionNum": null, "sectionTitle": "C.5 Constant availability", "kind": "bank"}, {"text": "The conversations also have few to no time limits, allowing users to interact with Character.ai bots for hours", "speaker": "Camille Carlton", "key": "carlton", "section": "sec-c-5-constant-availability", "sectionNum": null, "sectionTitle": "C.5 Constant availability", "kind": "bank"}, {"text": "like digital friends or characters you can text or talk with whenever you want", "speaker": "Common Sense Media", "key": "csm", "section": "sec-c-5-constant-availability", "sectionNum": null, "sectionTitle": "C.5 Constant availability", "kind": "bank"}, {"text": "The world's first personal intelligence", "speaker": "Pi", "key": "pi", "section": "sec-c-6-self-classification-and-its-refusal", "sectionNum": null, "sectionTitle": "C.6 Self-classification, and its refusal", "kind": "bank"}, {"text": "More than just an AI assistant, Copilot combines advanced language understanding with emotional intelligence features", "speaker": "Microsoft Copilot", "key": "copilot", "section": "sec-c-6-self-classification-and-its-refusal", "sectionNum": null, "sectionTitle": "C.6 Self-classification, and its refusal", "kind": "bank"}, {"text": "Now you can chat, work & code all in one place", "speaker": "OpenAI", "key": "openai", "section": "sec-c-6-self-classification-and-its-refusal", "sectionNum": null, "sectionTitle": "C.6 Self-classification, and its refusal", "kind": "bank"}, {"text": "Building the world's most capable AI assistant", "speaker": "Google", "key": "google", "section": "sec-c-6-self-classification-and-its-refusal", "sectionNum": null, "sectionTitle": "C.6 Self-classification, and its refusal", "kind": "bank"}, {"text": "a next-generation AI assistant based on Anthropic's research into training helpful, honest, and harmless AI systems", "speaker": "Anthropic", "key": "anthropic", "section": "sec-c-6-self-classification-and-its-refusal", "sectionNum": null, "sectionTitle": "C.6 Self-classification, and its refusal", "kind": "bank"}, {"text": "simulating interpersonal interaction with a user", "speaker": "Youth AI Privacy Act", "key": "youthact", "section": "sec-c-7-the-regulatory-object", "sectionNum": null, "sectionTitle": "C.7 The regulatory object", "kind": "bank"}, {"text": "we then have to define empathic design itself in a statute, which is an extraordinarily hard thing to write", "speaker": "Andrew McStay", "key": "mcstay", "section": "sec-c-7-the-regulatory-object", "sectionNum": null, "sectionTitle": "C.7 The regulatory object", "kind": "bank"}, {"text": "AI chatbots and companions remain part of the largely unregulated wellness industry", "speaker": "Efua Andoh", "key": "andoh", "section": "sec-c-7-the-regulatory-object", "sectionNum": null, "sectionTitle": "C.7 The regulatory object", "kind": "bank"}], "people": [{"key": "sun", "name": "Sun et al.", "org": "Child Development Perspectives", "role": "scholar", "note": "Source of the four-feature definition this paper adopts: memory, emotional responsiveness, anthropomorphism, constant availability. The only definition in the literature applicable without asking the company what kind of product it is.", "quoteCount": 2, "sections": ["sec-3-3", "sec-c-1-what-counts-as-a-companion"]}, {"key": "andoh", "name": "Efua Andoh", "org": "APA Monitor on Psychology", "role": "scholar", "note": "Draws the cleanest assistant/companion line — design intent around romance — then crosses it repeatedly in her own prose. Both the distinction and its failure are evidence here.", "quoteCount": 4, "sections": ["sec-3-1", "sec-c-1-what-counts-as-a-companion", "sec-c-2-memory-and-persistence", "sec-c-7-the-regulatory-object"]}, {"key": "bernardi", "name": "Jamie Bernardi", "org": "Ada Lovelace Institute", "role": "scholar", "note": "Treats companions as a subset of assistants rather than a separate species, which makes the boundary a matter of degree. Structurally closer to this paper's position than Andoh's.", "quoteCount": 2, "sections": ["sec-3-2", "sec-c-1-what-counts-as-a-companion"]}, {"key": "mcstay", "name": "Andrew McStay", "org": "Tech Policy Press", "role": "scholar", "note": "States the regulatory bind most precisely, and offers a rival functional definition: intimate functionality as emulated empathy, with IEEE 7014.1-2026 behind it.", "quoteCount": 3, "sections": ["sec-3-4", "sec-c-1-what-counts-as-a-companion", "sec-c-7-the-regulatory-object"]}, {"key": "carlton", "name": "Camille Carlton", "org": "Center for Humane Technology", "role": "scholar", "note": "Supplies the functional description of Character.AI that the company's own copy withholds. All four features, described from outside the firm.", "quoteCount": 4, "sections": ["sec-5-1", "sec-c-3-emotional-responsiveness", "sec-c-4-anthropomorphism-and-naming-the-relationship", "sec-c-5-constant-availability"]}, {"key": "thorn", "name": "Thorn", "org": "Youth-safety research", "role": "survey", "note": "N = 1,003 minors aged 9–17, Census-weighted. The prevalence and tool-share backbone of §2 — and an instrument that collapses chatbot and companion into one category, exemplified by one of each.", "quoteCount": 2, "sections": ["sec-2-1", "sec-c-1-what-counts-as-a-companion"]}, {"key": "csm", "name": "Common Sense Media", "org": "Children's media watchdog", "role": "survey", "note": "The one major survey that defines companions against assistants. Also an advocacy organisation that has called social AI companions an unacceptable risk to under-18s.", "quoteCount": 3, "sections": ["sec-3-5", "sec-c-1-what-counts-as-a-companion", "sec-c-5-constant-availability"]}, {"key": "pew", "name": "Pew Research Center", "org": "Youth survey research", "role": "survey", "note": "n = 1,458 teens, ±3.3 points. Uses the umbrella \"AI chatbots\", glossed with two assistants and one companion app — the same collapse as Thorn's.", "quoteCount": 1, "sections": ["sec-3-5"]}, {"key": "oed", "name": "Oxford English Dictionary", "org": "Lexicography", "role": "dictionary", "note": "The human baseline. Both entries encode reciprocity, which is the one companion property no current product supplies.", "quoteCount": 2, "sections": ["sec-4-1", "sec-c-1-what-counts-as-a-companion"]}, {"key": "replika", "name": "Replika", "org": "Companion app", "role": "company", "note": "Embraces the label outright and names the relationship menu. All four features in its own copy, including a selectable relationship status.", "quoteCount": 5, "sections": ["sec-5-1", "sec-c-2-memory-and-persistence", "sec-c-3-emotional-responsiveness", "sec-c-4-anthropomorphism-and-naming-the-relationship", "sec-c-5-constant-availability"]}, {"key": "kindroid", "name": "Kindroid", "org": "Companion app", "role": "company", "note": "Leads on memory and growth: \"listens, remembers, and grows with you\". The clearest first-party statement of the persistence feature.", "quoteCount": 2, "sections": ["sec-5-1", "sec-c-4-anthropomorphism-and-naming-the-relationship"]}, {"key": "nomi", "name": "Nomi", "org": "Companion app", "role": "company", "note": "Foregrounds persistence and non-judgment, and uses the word companion without hedging.", "quoteCount": 3, "sections": ["sec-5-1", "sec-c-2-memory-and-persistence", "sec-c-4-anthropomorphism-and-naming-the-relationship"]}, {"key": "characterai", "name": "Character.AI", "org": "Companion app", "role": "company", "note": "The paradigm companion app in the literature, describing itself as interactive entertainment. The most important single data point against category-based definition.", "quoteCount": 1, "sections": ["sec-5-1"]}, {"key": "pi", "name": "Pi", "org": "Inflection AI — assistant/companion hybrid", "role": "company", "note": "Exhibit A for the spectrum claim: companion affect and assistant tasks advertised in the same breath, under a name that is neither.", "quoteCount": 3, "sections": ["sec-5-2", "sec-c-3-emotional-responsiveness", "sec-c-6-self-classification-and-its-refusal"]}, {"key": "copilot", "name": "Microsoft Copilot", "org": "General-purpose assistant", "role": "company", "note": "An assistant reaching companion-ward. Microsoft titles a page \"What is an AI companion?\" and answers it with Copilot.", "quoteCount": 3, "sections": ["sec-5-2", "sec-c-3-emotional-responsiveness", "sec-c-6-self-classification-and-its-refusal"]}, {"key": "openai", "name": "OpenAI", "org": "General-purpose assistant", "role": "company", "note": "Current ChatGPT copy is task-framed. Quoted here from first-party pages, replacing the Wikipedia text the draft had used.", "quoteCount": 2, "sections": ["sec-5-3", "sec-c-6-self-classification-and-its-refusal"]}, {"key": "google", "name": "Google", "org": "General-purpose assistant", "role": "company", "note": "Task-framed at brand level, but \"rehearse for important moments\" is a companionship function in task clothing, and feature copy reaches for personalization.", "quoteCount": 3, "sections": ["sec-5-3", "sec-c-3-emotional-responsiveness", "sec-c-6-self-classification-and-its-refusal"]}, {"key": "anthropic", "name": "Anthropic", "org": "General-purpose assistant", "role": "company", "note": "The most austerely task-framed of the set — but quoted from a March 2023 launch post, which makes it a weaker comparator than the live pages beside it.", "quoteCount": 2, "sections": ["sec-5-3", "sec-c-6-self-classification-and-its-refusal"]}, {"key": "youthact", "name": "Youth AI Privacy Act", "org": "US Senate — S. 4199", "role": "lawmaker", "note": "Markey, introduced 25 March 2026. Defines its object functionally — \"simulating interpersonal interaction\" — with no carve-outs, so it reaches every assistant in §5. Minors only. Contains the corpus's only substantive memory ceiling and its most granular design regulation: a ban on typing indicators.", "quoteCount": 3, "sections": ["sec-7-2", "sec-c-4-anthropomorphism-and-naming-the-relationship", "sec-c-7-the-regulatory-object"]}, {"key": "pfca", "name": "People-First Chatbot Act", "org": "US House — Foushee", "role": "lawmaker", "note": "Began as a model bill from EPIC, the Consumer Federation of America and Fairplay. The first instrument in the corpus to define emotional dependence — reliance on a chatbot \"as a primary source\" of support — and to require monthly assessment for it. Covers all users, not only minors.", "quoteCount": 1, "sections": ["sec-7-2"]}], "sources": [{"key": "thorn", "short": "Thorn (2026)", "tier": 1, "title": "Youth Perspectives on Online Safety, 2025", "venue": "Annual report, Thorn", "method": "N = 1,003 US minors aged 9–17; weighted to Census benchmarks for age, gender, race, geography; multi-layered attention screening", "note": "Every figure used in §2 was checked against Figs 5A–5C and matches exactly. Cite freely for prevalence, tool share and context of use. Do NOT cite it for the companion/assistant distinction — its instrument collapses the two.", "pattern": "Thorn", "sections": ["sec-2-1", "sec-2-2", "sec-2-3", "sec-2-4", "sec-3-5", "sec-6-3", "sec-a-1-verified-without-change", "sec-a-2-corrected-or-requiring-attention", "sec-c-1-what-counts-as-a-companion"]}, {"key": "pew", "short": "Pew (2026)", "tier": 1, "title": "How Teens Use and View AI", "venue": "Pew Research Center", "method": "n = 1,458 US teens 13–17; fielded 25 Sep – 9 Oct 2025; MoE ±3.3 points", "note": "16% casual conversation and 12% emotional support verified against the report. Quote the base and the countervailing context (57% information-seeking, 54% schoolwork) whenever the companionship figures are used.", "pattern": "Pew", "sections": ["sec-2-1", "sec-3-5", "sec-5-3", "sec-7-4", "sec-a-1-verified-without-change", "sec-c-1-what-counts-as-a-companion"]}, {"key": "sun", "short": "Sun et al. (2026)", "tier": 1, "title": "AI Companions and Adolescent Social Relationships: Benefits, Risks, and Bidirectional Influences", "venue": "Child Development Perspectives (author manuscript, PMC)", "method": "Conceptual review with a design-feature definition", "note": "The definitional spine of the paper, and peer-reviewed. One caveat: the quotation is reproduced from the draft and was not checked against the manuscript, which was not supplied. Verify before submission.", "pattern": "Sun et al\\.", "sections": ["sec-3-3", "sec-3-4", "sec-3-6", "sec-6", "sec-6-1", "sec-7-4", "sec-7-5", "sec-8-1", "sec-a-3-not-verifiable-from-the-supplied-material", "sec-c-1-what-counts-as-a-companion"]}, {"key": "csm", "short": "Common Sense Media (2025)", "tier": 1, "title": "Talk, Trust, and Trade-Offs: How and Why Teens Use AI Companions", "venue": "Common Sense Media", "method": "n = 1,060 US teens aged 13–17", "note": "Solid instrument and the only one that defines companions against assistants. It is also an advocacy organisation that has declared social AI companions an unacceptable risk to under-18s — cite the data as data and attribute the position as a position. The report itself was not supplied; figures here come via Teen Vogue.", "pattern": "Common Sense Media", "sections": ["sec-1-5", "sec-2-1", "sec-2-3", "sec-3-5", "sec-7-1", "sec-a-1-verified-without-change", "sec-a-2-corrected-or-requiring-attention", "sec-a-3-not-verifiable-from-the-supplied-material", "sec-appendix-b-source-handling", "sec-c-1-what-counts-as-a-companion", "sec-c-5-constant-availability"]}, {"key": "copy", "short": "First-party product copy", "tier": 1, "title": "Marketing and about pages for the nine products ort": "McStay (2026)", "tier": 2, "title": "Intimate Functionality: A Phrase Defining the Next Year of AI Regulation", "venue": "Tech Policy Press — analysis", "method": "Argument; points to IEEE 7014.1-2026", "note": "Cite the argument, and cite the IEEE standard directly rather than through him where the standard is the point. The draft's paraphrase of his central sentence runs close enough to the original to need quotation marks — now quoted in §3.4.", "pattern": "McStay", "sections": ["sec-3-4", "sec-7-5", "sec-8-1", "sec-8-7", "sec-a-2-corrected-or-requiring-attention", "sec-c-1-what-counts-as-a-companion", "sec-c-7-the-regulatory-object"]}, {"key": "latifi", "short": "Latifi (2025)", "tier": 2, "title": "72% of Teens Are Turning to AI for Companionship", "venue": "Teen Vogue", "method": "Secondary reporting of the Common Sense Media survey", "note": "A reliable route to CSM's numbers and an unreliable route to its definitions: the article glosses \"AI companions like ChatGPT and Google's Gemini\", reinstating the assistants CSM's own definition excludes. Useful as evidence of definitional drift in transit (§3.5); replace with the CSM report for any figure.", "pattern": "Latifi|Teen Vogue", "sections": ["sec-2-1", "sec-2-3", "sec-3-5", "sec-a-1-verified-without-change", "sec-a-2-corrected-or-requiring-attention", "sec-appendix-b-source-handling"]}, {"key": "carlton", "short": "Carlton (n.d.)", "tier": 2, "title": "What Is Character.AI?", "venue": "Center for Humane Technology (Substack)", "method": "Advocacy analysis", "note": "The best available functional description of Character.AI and load-bearing in §5.1, because the company's own copy withholds it. Advocacy source: present the characterisation as argued rather than as neutral description. Missing from the reference list.", "pattern": "Carlton", "sections": ["sec-5-1", "sec-a-2-corrected-or-requiring-attention", "sec-c-3-emotional-responsiveness", "sec-c-4-anthropomorphism-and-naming-the-relationship", "se var S={view:'report',sec:null,person:null,vtab:null,q:''};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
var SEC={}; D.sections.forEach(function(s){SEC[s.id]=s});
var PPL={}; D.people.forEach(function(p){PPL[p.key]=p});
function secLabel(s){return (s.num?s.num+' ':'')+s.title}
function partOf(s){return s.part}
function childrenOf(id){return D.sections.filter(function(x){return x.parent===id})}
/* punctuation-only editorial brackets are display noise; word insertions and [*sic*] are kept */
function clean(t){return String(t).replace(/\[([,.;:\u2014-])\]/g,'$1').replace(/\s+([,.;:])/g,'$1')}

/* ---------- navigation ---------- */
function buildNav(){
  var h='';
  h+='<div class="navgrp"><div class="lbl">Views</div>';
  [['report','Full document'],['people','Who says what'],['sources','Sources &amp; tiers'],['visuals','Visualisations'],['notes','My notes']].forEach(function(v){
    var badge=(v[0]==='notes'&&typeof ANN!=='undefined'&&ANN.length)?'<span class="annbadge">'+ANN.length+'</span>':'';
    h+='<div class="nav'+(S.view===v[0]&&!S.sec?' on':'')+'" data-go="'+v[0]+'">'+v[1]+badge+'</div>';
  });
  h+='</div><div class="navgrp"><div class="lbl">Contents</div>';
  D.sections.filter(function(s){return s.level===1}).forEach(function(s){
    h+='<div class="nav'+(S.sec===s.id?' on':'')+'" data-sec="'+s.id+'">'+(s.num?'<span class="n">'+s.num+'</span>':'')+esc(s.title)+'</div>';
    if(S.sec&&partOf(SEC[S.sec])===partOf(s)){
      childrenOf(s.id).forEach(function(x){
        h+='<div class="nav sub2'+(S.sec===x.id?' on':'')+'" data-sec="'+x.id+'"><span class="n">'+(x.num||'·')+'</span>'+esc(x.title)+'</div>';
      });
    }
  });
  h+='</div>';
  $('#nav').innerHTML=h;
}

/* ---------- report ---------- */
function vReport(){
  if(!S.sec){
    var h='<h2 class="vt">Full document</h2><p class="vd">'+D.sections.length+' sections · '+
      D.sections.reduce(function(a,s){return a+s.words},0).toLocaleString()+' words · '+D.quotes.length+
      ' attributed quotations · '+D.people.length+' definers · '+D.sources.length+
      ' tiered sources. Click any part to read it; every quotation links back to whoever said it, and every claim added from a source beyond the original draft is flagged.</p>';
    D.sections.filter(function(s){return s.level===1}).forEach(function(s){
      var kids=childrenOf(s.id);
      var tw=s.words+kids.reduce(function(a,k){return a+k.words},0);
      h+='<div class="card click" data-sec="'+s.id+'" style="margin-bottom:11px"><div class="nm">'+(s.num?s.num+'. ':'')+esc(s.title)+'</div>'+
         '<div class="og">'+tw.toLocaleString()+' words'+(kids.length?' · '+kids.length+' subsections':'')+
         (s.people.length?' · '+s.people.length+' voices':'')+'</div>';
      if(kids.length) h+='<div style="font:12.5px \'Helvetica Neue\',sans-serif;color:#5f6672">'+kids.map(function(k){return (k.num?k.num+' ':'')+esc(k.title)}).join(' &nbsp;·&nbsp; ')+'</div>';
      h+='</div>';
    });
    return h;
  }
  var s=SEC[S.sec], part=partOf(s);
  var top = s.level===1 ? s : SEC[s.parent];
  var kids = childrenOf(top.id);
  var numbered = kids.filter(function(k){return k.num});
  var cont = kids.filter(function(k){return !k.num});

  var h='<div style="font:11.5px \'Helvetica Neue\',sans-serif;color:#8b929e;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">'+
    '<span data-go="report" style="cursor:pointer">Report</span> › '+esc(top.num?'Part '+top.num:top.title.split('—')[0].trim())+'</div>';
  h+='<h2 class="vt">'+(s.num?s.num+'. ':'')+esc(s.title)+'</h2>';

  var pl=s.people.map(function(k){return PPL[k]}).filter(Boolean);
  if(pl.length||s.newFlags){
    h+='<p class="vd" style="margin-bottom:14px">';
    pl.forEach(function(p){h+='<span class="pill" data-person="'+p.key+'" style="cursor:pointer">'+esc(p.name)+'</span>'});
    if(s.newFlags) h+='<span class="pill w">'+s.newFlags+' externally-sourced claim'+(s.newFlags>1?'s':'')+'</span>';
    h+='</p>';
  }
  var na=(typeof annFor==='function')?annFor(s.id).length:0;
  if(na) h+='<p class="vd" style="margin:-8px 0 14px;font-size:13px">'+na+' of your annotation'+(na===1?'':'s')+' in this section</p>';
  // tab bar across the part: the part itself plus its numbered subsections
  if(numbered.length){
    h+='<div class="tabs"><div class="tab'+(s.id===top.id?' on':'')+'" data-sec="'+top.id+'">'+(top.num?top.num:'Top')+'</div>';
    numbered.forEach(function(x){h+='<div class="tab'+(x.id===s.id?' on':'')+'" data-sec="'+x.id+'" title="'+esc(x.title)+'">'+x.num+'</div>'});
    h+='</div>';
  }

  h+='<div id="readwrap"><div id="readcol"><div class="prose">'+s.html+'</div>';

  // a level-1 section absorbs its unnumbered children (they are continuations of it)
  if(s.level===1 && cont.length){
    cont.forEach(function(c){
      h+='<div class="prose"><h3 id="'+c.id+'">'+esc(c.title)+'</h3>'+c.html+'</div>';
    });
  }
  h+='</div><div id="gutter"></div></div>';
  // and lists its numbered children so the part page is never a dead end
  if(s.level===1 && numbered.length){
    h+='<div class="viz" style="margin-top:26px"><h3>In this part</h3><p class="cap">'+numbered.length+' sections · '+
       (numbered.reduce(function(a,x){return a+x.words},0)+s.words).toLocaleString()+' words.</p>';
    numbered.forEach(function(x){
      h+='<div class="card click" data-sec="'+x.id+'" style="margin-bottom:9px"><div class="nm">'+x.num+' '+esc(x.title)+'</div>'+
         '<div class="og">'+x.words.toLocaleString()+' words'+(x.people.length?' · '+x.people.map(function(k){return PPL[k]?PPL[k].name.split(' ').slice(-1)[0]:''}).filter(Boolean).join(', '):'')+'</div></div>';
    });
    h+='</div>';
  }

  if(s.refs.length){
    h+='<div class="viz" style="margin-top:26px"><h3>Cross-references</h3><p class="cap">Sections this one points to.</p>';
    s.refs.forEach(function(r){
      var t=D.sections.filter(function(x){return x.num===r})[0];
      if(t) h+='<span class="pill" data-sec="'+t.id+'" style="cursor:pointer">§'+r+' '+esc(t.title)+'</span>';
    });
    h+='</div>';
  }
  return h;
}
