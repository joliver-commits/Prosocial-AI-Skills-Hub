/* ---- reusable 2x2 scatter ----
   Every piece of text is registered as a reserved rectangle before point labels are
   placed, so labels dodge the axis captions and quadrant names as well as each other.
   Coincident points are separated first. ---- */
function scatter(cfg){
  var W=cfg.w||700, H=cfg.h||470, L=58, R=26, T=46, B=58;
  var pw=W-L-R, ph=H-T-B, CH=6.4, LH=13;
  var res=[];                                    // reserved rectangles
  function reserve(x,y,txt,anchor){
    var w=txt.length*CH;
    var x0 = anchor==='end' ? x-w : (anchor==='middle' ? x-w/2 : x);
    res.push({x0:x0-3,x1:x0+w+3,y0:y-10,y1:y+4});
  }
  var h='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  h+='<rect x="'+L+'" y="'+T+'" width="'+pw+'" height="'+ph+'" fill="#fdfcfa" stroke="#e3e0da"/>';
  h+='<line x1="'+(L+pw/2)+'" y1="'+T+'" x2="'+(L+pw/2)+'" y2="'+(T+ph)+'" stroke="#eae7e1"/>';
  h+='<line x1="'+L+'" y1="'+(T+ph/2)+'" x2="'+(L+pw)+'" y2="'+(T+ph/2)+'" stroke="#eae7e1"/>';

  /* quadrant names sit just under the top edge of each quadrant, and are reserved */
  (cfg.quads||[]).forEach(function(q){
    if(!q.t) return;
    var qx = L + pw*(q.right?0.75:0.25);
    var qy = T + ph*(q.lower?0.78:0.22);
    h+='<text x="'+qx+'" y="'+qy+'" font-size="10" fill="#cac4b6" text-anchor="middle" font-style="italic">'+esc(q.t)+'</text>';
    reserve(qx,qy,q.t,'middle');
  });
  if(cfg.threshold!==undefined){
    var tx=L+(cfg.threshold/100)*pw;
    h+='<line x1="'+tx+'" y1="'+T+'" x2="'+tx+'" y2="'+(T+ph)+'" stroke="#8a3a1e" stroke-dasharray="4 3" stroke-width="1.3"/>';
  }
  /* optional y=x reference line: makes "above/below the diagonal" readable rather than asserted */
  if(cfg.diag){
    h+='<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(L+pw)+'" y2="'+T+'" stroke="#cdc6b8" stroke-dasharray="5 4" stroke-width="1.1"/>';
  }
  /* axis captions: titles outside the frame, extremity labels inside and reserved */
  h+='<text x="'+(L+pw/2)+'" y="'+(T+ph+40)+'" font-size="11.5" text-anchor="middle" fill="#5f6672">'+esc(cfg.x)+'</text>';
  h+='<text x="'+L+'" y="'+(T+ph+20)+'" font-size="10.5" fill="#8b929e">◀ '+esc(cfg.xLeft)+'</text>';
  h+='<text x="'+(L+pw)+'" y="'+(T+ph+20)+'" font-size="10.5" text-anchor="end" fill="#8b929e">'+esc(cfg.xRight)+' ▶</text>';
  h+='<text transform="translate(15,'+(T+ph/2)+') rotate(-90)" font-size="11.5" text-anchor="middle" fill="#5f6672">'+esc(cfg.y)+'</text>';
  var yT='▲ '+cfg.yTop, yB='▼ '+cfg.yBottom;
  h+='<text x="'+(L+7)+'" y="'+(T+15)+'" font-size="10.5" fill="#a7a094">'+esc(yT)+'</text>';
  reserve(L+7,T+15,yT,'start');
  h+='<text x="'+(L+7)+'" y="'+(T+ph-7)+'" font-size="10.5" fill="#a7a094">'+esc(yB)+'</text>';
  reserve(L+7,T+ph-7,yB,'start');

  var pts=cfg.pts.map(function(p){
    return {n:p.n,cx:L+(p.x/100)*pw,cy:T+((100-p.y)/100)*ph,hl:p.hl};
  });
  pts.forEach(function(p,i){
    pts.slice(0,i).forEach(function(q){
      if(Math.abs(p.cx-q.cx)<10 && Math.abs(p.cy-q.cy)<10){ p.cx+=12; p.cy+=10 }
    });
  });
  pts.sort(function(a,b){return a.cy-b.cy});

  pts.forEach(function(p){
    var w=p.n.length*CH;
    var best=null;
    /* try: right then left, walking outward from the point's own row */
    [1,-1].forEach(function(side){
      if(best) return;
      for(var k=0;k<22 && !best;k++){
        for(var dir=0; dir<(k?2:1) && !best; dir++){
          var ly=p.cy+4 + (dir? -k*LH : k*LH);
          if(ly<T+13 || ly>T+ph-5) continue;
          var lx=p.cx+side*11;
          var x0 = side<0 ? lx-w : lx;
          if(x0<L+4 || x0+w>L+pw-4) continue;
          var box={x0:x0-2,x1:x0+w+2,y0:ly-10,y1:ly+4};
          var clash=res.some(function(r){
            return !(box.x1<r.x0||r.x1<box.x0||box.y1<r.y0||r.y1<box.y0);
          });
          if(!clash) best={lx:lx,ly:ly,side:side,box:box};
        }
      }
    });
    if(!best){ var lx=p.cx+11, ly=p.cy+4;
      best={lx:lx,ly:ly,side:1,box:{x0:lx-2,x1:lx+w+2,y0:ly-10,y1:ly+4}} }
    res.push(best.box);
    h+='<circle cx="'+p.cx+'" cy="'+p.cy+'" r="'+(p.hl?7:5.5)+'" fill="'+(p.hl?'#8a3a1e':'#2f5596')+'" opacity="'+(p.hl?.95:.82)+'"/>';
    if(Math.abs(best.ly-(p.cy+4))>7 || Math.abs(best.lx-p.cx)>26)
      h+='<line x1="'+p.cx+'" y1="'+p.cy+'" x2="'+(best.lx-best.side*3)+'" y2="'+(best.ly-4)+'" stroke="#d4d8e0"/>';
    h+='<text x="'+best.lx+'" y="'+best.ly+'" font-size="11.5" fill="'+(p.hl?'#8a3a1e':'#16181d')+'" text-anchor="'+(best.side<0?'end':'start')+'">'+esc(p.n)+'</text>';
  });
  return h+'</svg>';
}

/* ---- 1D strip ---- */
function strip(cfg){
  var W=700, L=70, R=40, pw=W-L-R, rows=cfg.pts.length, H=rows*26+86;
  var h='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  h+='<line x1="'+L+'" y1="34" x2="'+(L+pw)+'" y2="34" stroke="#d8d4cc" stroke-width="2"/>';
  h+='<text x="'+L+'" y="22" font-size="11" fill="#1d6b4a" font-weight="600">'+esc(cfg.left)+'</text>';
  h+='<text x="'+(L+pw)+'" y="22" font-size="11" text-anchor="end" fill="#8a3a1e" font-weight="600">'+esc(cfg.right)+'</text>';
  if(cfg.threshold!==undefined){
    var tx=L+(cfg.threshold/100)*pw;
    h+='<line x1="'+tx+'" y1="26" x2="'+tx+'" y2="'+(H-34)+'" stroke="#8a3a1e" stroke-dasharray="4 3"/>';
    h+='<text x="'+(tx+5)+'" y="'+(H-22)+'" font-size="10.5" fill="#8a3a1e">'+esc(cfg.thresholdLabel||'')+'</text>';
  }
  cfg.pts.slice().sort(function(a,b){return a.x-b.x}).forEach(function(p,i){
    var px=L+(p.x/100)*pw, y=i*26+62;
    h+='<circle cx="'+px+'" cy="34" r="5.5" fill="#2f5596"/>';
    h+='<path d="M'+px+' 40 V'+(y-9)+'" stroke="#dcd8d0" stroke-dasharray="2 3"/>';
    h+='<circle cx="'+px+'" cy="'+(y-5)+'" r="3" fill="#2f5596" opacity=".5"/>';
    /* A point at the axis maximum would push its label past the right edge, so flip the label
       to the left of the point when it would not fit. Without this, every item sharing the top
       value is silently clipped — and the bundled audit only inspects the last tab, so it does
       not catch it. */
    var lw=String(p.n).length*6.4, right=(px+9+lw <= W-4);
    h+='<text x="'+(px+(right?9:-9))+'" y="'+(y-1)+'" font-size="11.5" fill="#16181d"'+
       (right?'':' text-anchor="end"')+'>'+esc(p.n)+'</text>';
  });
  return h+'</svg>';
}

/* ================= NOTES ================= */
var AKEY='caper.'+(((D.meta&&D.meta.title)||'doc').replace(/\W+/g,'').slice(0,28))+'.notes.v1';
var ANN=[];
try{ ANN=JSON.parse(localStorage.getItem(AKEY)||'[]') }catch(e){ ANN=[] }
/* migrate anything written by the earlier build */
try{ var old=JSON.parse(localStorage.getItem('ttuo.annotations.v1')||'[]');
     if(old.length&&!ANN.length){ ANN=old; localStorage.setItem(AKEY,JSON.stringify(ANN)) } }catch(e){}

var saveT=null;
function saveAnn(){
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    try{ localStorage.setItem(AKEY,JSON.stringify(ANN.map(function(a){
      return {id:a.id,sec:a.sec,quote:a.quote,prefix:a.prefix,suffix:a.suffix,occ:a.occ,note:a.note,created:a.created};
    }))) }catch(e){ console.warn('save failed',e) }
  },250);
}
function annFor(sec){ return ANN.filter(function(a){return a.sec===sec}) }
function uid(){ return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5) }

/* ---------- anchoring ---------- */
function textMap(root){
  var nodes=[], txt='', w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null), n;
  while((n=w.nextNode())){ nodes.push({node:n,start:txt.length}); txt+=n.nodeValue }
  return {nodes:nodes,text:txt};
}
function locate(map,a){
  var t=map.text;
  if(a.prefix||a.suffix){
    var whole=(a.prefix||'')+a.quote+(a.suffix||''), i=t.indexOf(whole);
    if(i>=0) return {s:i+(a.prefix||'').length,e:i+(a.prefix||'').length+a.quote.length};
  }
  var hits=[],from=0,j;
  while((j=t.indexOf(a.quote,from))>=0 && hits.length<80){ hits.push(j); from=j+1 }
  if(!hits.length) return null;
  var k=Math.min(a.occ||0,hits.length-1);
  return {s:hits[k],e:hits[k]+a.quote.length};
}
function rangeFrom(map,s,e){
  var r=document.createRange(), set=false;
  for(var i=0;i<map.nodes.length;i++){
    var nd=map.nodes[i], a=nd.start, b=a+nd.node.nodeValue.length;
    if(!set && s>=a && s<b){ r.setStart(nd.node,s-a); set=true }
    if(set && e>=a && e<=b){ r.setEnd(nd.node,e-a); return r }
  }
  return null;
}
/* mark the anchored text so a note is visibly attached to something */
function paintAnchors(){
  var col=document.getElementById('readcol'); if(!col) return;
  annFor(S.sec).forEach(function(a){
    var map=textMap(col), loc=locate(map,a);
    a._orphan=!loc; if(!loc) return;
    var r=rangeFrom(map,loc.s,loc.e); if(!r){ a._orphan=true; return }
    try{
      var frag=r.extractContents(), sp=document.createElement('span');
      sp.className='noteanchor'; sp.dataset.ann=a.id; sp.appendChild(frag); r.insertNode(sp);
    }catch(err){ a._orphan=true }
  });
}

/* ---------- gutter: build once per id-set, then only move ---------- */
var builtSig='';
function cardHTML(a){
  return '<div class="anncard'+(a._orphan?' orphan':'')+'" data-card="'+a.id+'">'+
    (a._orphan?'<div class="stamp orph">⚠ anchor text changed</div>':'')+
    '<div class="qz">'+esc(a.quote.slice(0,140))+(a.quote.length>140?'…':'')+'</div>'+
    '<textarea data-note="'+a.id+'" rows="2" placeholder="Write a note…">'+esc(a.note||'')+'</textarea>'+
    '<div class="row"><span class="stamp" data-stamp="'+a.id+'">'+new Date(a.created).toLocaleDateString()+'</span>'+
    '<span class="sp"></span><button data-del="'+a.id+'" title="Delete note">Delete</button></div></div>';
}
function buildGutter(){
  var g=document.getElementById('gutter'); if(!g) return;
  var list=annFor(S.sec);
  var sig=S.sec+'|'+list.map(function(a){return a.id}).join(',');
  if(sig===builtSig){ positionCards(); return }
  builtSig=sig;
  g.innerHTML=list.map(cardHTML).join('');
  g.querySelectorAll('textarea').forEach(autoGrow);
  positionCards();
}
function autoGrow(ta){ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+2)+'px' }
function positionCards(){
  var g=document.getElementById('gutter'), wrap=document.getElementById('readwrap');
  if(!g||!wrap) return;
  var base=wrap.getBoundingClientRect().top;
  var cards=[].slice.call(g.querySelectorAll('.anncard'));
  cards.forEach(function(c){
    var el=document.querySelector('.noteanchor[data-ann="'+c.dataset.card+'"]');
    c._want = el ? Math.max(0, el.getBoundingClientRect().top-base) : 0;
  });
  cards.sort(function(a,b){return a._want-b._want});
  var y=0;
  cards.forEach(function(c){
    var t=Math.max(c._want,y);
    c.style.top=t+'px';
    y=t+c.offsetHeight+10;
  });
}

/* ---------- create a note from a selection ---------- */
var PEND=null;
function hideTip(){ var t=document.getElementById('seltip'); if(t) t.style.display='none'; PEND=null }
document.addEventListener('selectionchange',function(){
  if(document.activeElement && document.activeElement.tagName==='TEXTAREA') return;
  clearTimeout(window._selT);
  window._selT=setTimeout(function(){
    var sel=window.getSelection(), col=document.getElementById('readcol'), tip=document.getElementById('seltip');
    if(!tip) return;
    if(!sel||sel.isCollapsed||!col||!sel.anchorNode||!col.contains(sel.anchorNode)||!col.contains(sel.focusNode)){ hideTip(); return }
    var q=sel.toString().replace(/\s+/g,' ').trim();
    if(q.length<4){ hideTip(); return }
    var map=textMap(col), full=map.text.replace(/\s+/g,' ');
    var pre='';
    try{ var rr=sel.getRangeAt(0).cloneRange(); rr.setStart(col,0); pre=rr.toString().replace(/\s+/g,' ') }catch(e){}
    var before=pre.slice(0,Math.max(0,pre.length-q.length));
    var occ=0,i=0; while((i=before.indexOf(q,i))>=0){ occ++; i+=1 }
    PEND={quote:q,prefix:before.slice(-36),suffix:full.slice(before.length+q.length,before.length+q.length+36),occ:occ};
    var r=sel.getRangeAt(0).getBoundingClientRect();
    tip.style.display='flex';
    tip.style.left=Math.max(8,r.left+window.scrollX)+'px';
    tip.style.top=(r.top+window.scrollY-42)+'px';
  },140);
});
function addNote(){
  if(!PEND) return;
  var a={id:uid(),sec:S.sec,quote:PEND.quote,prefix:PEND.prefix,suffix:PEND.suffix,occ:PEND.occ,note:'',created:Date.now(),_fresh:true};
  ANN.push(a); saveAnn(); hideTip();
  try{ window.getSelection().removeAllRanges() }catch(e){}
  var wrap=document.getElementById('readwrap'); if(wrap) wrap.classList.remove('nogut');
  builtSig='';                       // force a rebuild that includes the new card
  paintAnchors(); buildGutter();
  var ta=document.querySelector('textarea[data-note="'+a.id+'"]');
  if(ta){ ta.focus() }
  buildNav();
}
/* ---------- editing: never rebuild the gutter while typing ---------- */
document.addEventListener('input',function(e){
  var ta=e.target.closest && e.target.closest('textarea[data-note]');
  if(!ta) return;
  var a=ANN.filter(function(x){return x.id===ta.dataset.note})[0];
  if(!a) return;
  a.note=ta.value; a._fresh=false;
  autoGrow(ta);
  requestAnimationFrame(positionCards);   // move siblings, do not re-create anything
  saveAnn();
  var st=document.querySelector('[data-stamp="'+a.id+'"]');
  if(st){ st.textContent='saved'; clearTimeout(a._st);
    a._st=setTimeout(function(){ st.textContent=new Date(a.created).toLocaleDateString() },1200) }
});
/* discard a note left completely empty, so nothing accumulates by accident */
document.addEventListener('focusout',function(e){
  var ta=e.target.closest && e.target.closest('textarea[data-note]');
  if(!ta) return;
  var id=ta.dataset.note, a=ANN.filter(function(x){return x.id===id})[0];
  if(a && !(a.note||'').trim()){
    ANN=ANN.filter(function(x){return x.id!==id}); saveAnn();
    if(S.view==='report'&&S.sec){ builtSig=''; render() } else buildNav();
  }
});
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='TEXTAREA'&&(e.key==='Escape'||((e.metaKey||e.ctrlKey)&&e.key==='Enter'))){ e.target.blur() }
});
window.addEventListener('resize',function(){ clearTimeout(window._rz); window._rz=setTimeout(positionCards,150) });

/* ---------- clicks ---------- */
document.addEventListener('mousedown',function(e){
  if(e.target.closest && e.target.closest('#seltip')) e.preventDefault();   // keep the selection alive
});
document.addEventListener('click',function(e){
  if(e.target.closest('#seltip')){ addNote(); return }
  var d=e.target.closest('[data-del]');
  if(d){ ANN=ANN.filter(function(x){return x.id!==d.dataset.del}); saveAnn(); builtSig='';
         if(S.view==='report'&&S.sec) render(); else render(); return }
  var an=e.target.closest('.noteanchor');
  if(an){
    var c=document.querySelector('.anncard[data-card="'+an.dataset.ann+'"]');
    if(c){ document.querySelectorAll('.anncard').forEach(function(x){x.classList.remove('sel')});
           c.classList.add('sel'); var t=c.querySelector('textarea'); if(t) t.focus() }
    return;
  }
  var cd=e.target.closest('[data-card]');
  if(cd && !e.target.closest('textarea') && !e.target.closest('button')){
    var el=document.querySelector('.noteanchor[data-ann="'+cd.dataset.card+'"]');
    if(el){ el.scrollIntoView({block:'center',behavior:'smooth'});
      el.classList.add('flash'); setTimeout(function(){el.classList.remove('flash')},1200) }
  }
});

/* ---------- notes view ---------- */
function vNotes(){
  var h='<h2 class="vt">My notes</h2>';
  var tools='<div style="margin:0 0 22px;display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn" data-exp="1">Export JSON</button>'+
    '<button class="btn" data-md="1">Export Markdown</button>'+
    '<button class="btn" data-imp="1">Import…</button></div>';
  if(!ANN.length) return h+'<p class="vd">No notes yet. Open a section of the report, select any passage, and click <b>Add note</b>.</p>'+tools+
    '<div class="viz"><h3>Where notes live</h3><p class="cap">Notes are stored in this browser, keyed to this file — not inside the HTML. '+
    'If the file is replaced, moved to another machine, or opened in a different browser, they will not follow. <b>Export before any of those.</b></p></div>';
  var bySec={}; ANN.forEach(function(a){(bySec[a.sec]=bySec[a.sec]||[]).push(a)});
  h+='<p class="vd">'+ANN.length+' note'+(ANN.length===1?'':'s')+' across '+Object.keys(bySec).length+
     ' section'+(Object.keys(bySec).length===1?'':'s')+'. Click any to open it in context.</p>'+tools;
  D.sections.forEach(function(s){
    if(!bySec[s.id])return;
    h+='<div class="qgrp"><div class="hd" data-sec="'+s.id+'"><span>'+esc(secLabel(s))+'</span><span class="c">'+bySec[s.id].length+' →</span></div>';
    bySec[s.id].forEach(function(a){
      h+='<div class="qt" data-sec="'+s.id+'" style="cursor:pointer;border-left-color:#9fb4d8">“'+esc(a.quote.slice(0,230))+(a.quote.length>230?'…':'')+'”';
      if((a.note||'').trim()) h+='<span class="notebody">'+esc(a.note)+'</span>';
      h+='<span class="meta">'+new Date(a.created).toLocaleString()+'</span></div>';
    });
    h+='</div>';
  });
  return h;
}
function download(name,text,type){
  var b=new Blob([text],{type:type||'application/json'}), u=URL.createObjectURL(b);
  var a=document.createElement('a'); a.href=u; a.download=name; a.click();
  setTimeout(function(){URL.revokeObjectURL(u)},900);
}
document.addEventListener('click',function(e){
  if(e.target.closest('[data-exp]')){ download('notes-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(ANN,null,2)); return }
  if(e.target.closest('[data-md]')){
    var out='# Notes — '+((D.meta&&D.meta.title)||'document')+'\n\n', bySec={};
    ANN.forEach(function(a){(bySec[a.sec]=bySec[a.sec]||[]).push(a)});
    D.sections.forEach(function(s){ if(!bySec[s.id])return;
      out+='## '+secLabel(s)+'\n\n';
      bySec[s.id].forEach(function(a){ out+='> '+a.quote+'\n\n'+((a.note||'').trim()?a.note+'\n\n':'') });
    });
    download('notes-'+new Date().toISOString().slice(0,10)+'.md',out,'text/markdown'); return }
  if(e.target.closest('[data-imp]')){
    var inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
    inp.onchange=function(){ var f=inp.files[0]; if(!f)return; var fr=new FileReader();
      fr.onload=function(){ try{ var arr=JSON.parse(fr.result); if(!Array.isArray(arr)) throw 0;
        var have={}; ANN.forEach(function(a){have[a.id]=1}); var n=0;
        arr.forEach(function(a){ if(a&&a.id&&a.quote&&!have[a.id]){ANN.push(a);n++} });
        saveAnn(); builtSig=''; render(); alert('Imported '+n+' note'+(n===1?'':'s')+'.');
      }catch(err){ alert('That did not look like an exported notes file.') } };
      fr.readAsText(f) };
    inp.click(); return }
});


/* ================= SEARCH ================= */
function tok(s){return String(s).toLowerCase().replace(/[^a-z0-9\s']/g,' ').split(/\s+/).filter(function(w){return w.length>1})}
var IDX=[];
D.sections.forEach(function(s){
  IDX.push({t:'section',id:s.id,title:secLabel(s),body:s.html.replace(/<[^>]+>/g,' '),meta:'Part '+partOf(s)+' · '+s.words+' words'});
});
D.quotes.forEach(function(q,i){
  IDX.push({t:'quote',id:q.section,qi:i,title:q.speaker,body:clean(q.text),meta:'§'+(q.sectionNum||'')+' '+q.sectionTitle});
});
D.people.forEach(function(p){IDX.push({t:'person',id:p.key,title:p.name,body:p.note+' '+p.org,meta:p.org+' · '+p.quoteCount+' quotations'})});
D.sources.forEach(function(s){IDX.push({t:'source',id:s.key,title:s.short,body:s.title+' '+s.venue+' '+s.method+' '+s.note,meta:'Tier '+s.tier})});
IDX.forEach(function(r){r._=(r.t==='quote'?(r.title+' '+r.body):(r.title+' '+r.body+' '+r.meta)).toLowerCase()});

function hi(text,terms){
  var out=esc(text);
  terms.forEach(function(t){
    if(t.length<2)return;
    out=out.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
  });
  return out;
}
function snippet(body,terms){
  var low=body.toLowerCase(), pos=-1;
  for(var i=0;i<terms.length&&pos<0;i++) pos=low.indexOf(terms[i]);
  if(pos<0)pos=0;
  var st=Math.max(0,pos-110), s=body.slice(st,st+320).trim();
  return (st>0?'… ':'')+hi(s,terms)+(st+320<body.length?' …':'');
}
function vSearch(){
  var terms=tok(S.q);
  var hits=IDX.filter(function(r){return terms.every(function(t){return r._.indexOf(t)>=0})});
  var order={section:0,quote:1,person:2,source:3};
  hits.sort(function(a,b){
    var at=a.title.toLowerCase().indexOf(terms[0])>=0?0:1, bt=b.title.toLowerCase().indexOf(terms[0])>=0?0:1;
    return at-bt || order[a.t]-order[b.t];
  });
  var h='<h2 class="vt">“'+esc(S.q)+'”</h2><p class="vd">'+hits.length+' result'+(hits.length===1?'':'s')+
    ' across sections, quotations, people and sources.</p>';
  if(!hits.length) return h+'<div class="empty">Nothing matched. Try a person\'s name, a tool, or a concept like <i>friction</i>, <i>boosting</i>, <i>paternalism</i>, <i>data</i>.</div>';
  var by={};hits.forEach(function(r){(by[r.t]=by[r.t]||[]).push(r)});
  [['quote','Quotations'],['section','Sections'],['person','People'],['source','Sources']].forEach(function(g){
    if(!by[g[0]])return;
    h+='<div style="font:10.5px \'Helvetica Neue\',sans-serif;text-transform:uppercase;letter-spacing:.1em;color:#8b929e;margin:22px 0 4px">'+g[1]+' ('+by[g[0]].length+')</div>';
    by[g[0]].slice(0,60).forEach(function(r){
      var act = r.t==='person' ? 'data-person="'+r.id+'"' : r.t==='source' ? '' : 'data-sec="'+r.id+'"';
      h+='<div class="sr" '+act+'><div class="k">'+r.t+'</div><div class="t">'+hi(r.title,terms)+'</div>';
      if(r.t!=='person'&&r.t!=='source') h+='<div style="font-size:13px;color:#5f6672;font-style:'+(r.t==='quote'?'italic':'normal')+'">'+snippet(r.body,terms)+'</div>';
      h+='<div class="w">'+esc(r.meta)+'</div></div>';
    });
    if(by[g[0]].length>60) h+='<div class="w" style="padding:8px 0">+ '+(by[g[0]].length-60)+' more</div>';
  });
  return h;
}

/* ================= RENDER + EVENTS ================= */
function render(push){
  var v = S.q ? vSearch() : {report:vReport,people:vPeople,sources:vSources,visuals:vVisuals,notes:vNotes}[S.view]();
  $('#view').innerHTML=v;
  if(S.view==='report'&&S.sec&&typeof paintAnchors==='function'){
    var w=document.getElementById('readwrap');
    if(w && !annFor(S.sec).length) w.classList.add('nogut');
    builtSig='';
    paintAnchors(); buildGutter();
  }
  buildNav();
  window.scrollTo({top:0,behavior:'instant'});
  var hash = S.q?'q='+encodeURIComponent(S.q) : S.sec?S.sec : S.person?'p-'+S.person : S.view+(S.view==='visuals'?':'+S.vtab:'');
  if('#'+hash!==location.hash){ if(push) history.pushState(null,'','#'+hash); else history.replaceState(null,'','#'+hash); }
}
function readHash(){
  var hs=decodeURIComponent(location.hash.replace(/^#/,''));
  S.q='';S.sec=null;S.person=null;
  if(!hs){S.view='report';return}
  if(hs.indexOf('q=')===0){S.q=hs.slice(2);$('#q').value=S.q;return}
  if(hs.indexOf('p-')===0){S.view='people';S.person=hs.slice(2);return}
  if(SEC[hs]){S.view='report';S.sec=hs;return}
  var bits=hs.split(':');
  if(['report','people','sources','visuals','notes'].indexOf(bits[0])>=0){S.view=bits[0];if(bits[1])S.vtab=bits[1]}
  else S.view='report';
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-sec],[data-person],[data-go],[data-vt]');
  if(!t)return;
  if(t.dataset.sec){S.q='';$('#q').value='';S.view='report';S.sec=t.dataset.sec;S.person=null}
  else if(t.dataset.person){S.q='';$('#q').value='';S.view='people';S.person=t.dataset.person;S.sec=null}
  else if(t.dataset.go){S.q='';$('#q').value='';S.view=t.dataset.go;S.sec=null;S.person=null}
  else if(t.dataset.vt){S.vtab=t.dataset.vt}
  render(true);
});
var deb;
$('#q').addEventListener('input',function(e){
  clearTimeout(deb);
  deb=setTimeout(function(){S.q=e.target.value.trim();render()},130);
});
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus()}
  if(e.key==='Escape'){$('#q').value='';S.q='';$('#q').blur();render()}
});
window.addEventListener('hashchange',function(){readHash();render()});
window.addEventListener('popstate',function(){readHash();render()});
readHash();
render();
</script></body></html>
