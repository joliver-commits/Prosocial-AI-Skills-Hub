<script>var D={"meta": {"title": "What Is an \"AI Companion\"?", "subtitle": "The definitional problem · research index", "byline": "Jane Oliver — Berkman Klein Center", "date": "Working draft, August 2026"}, "sections": [{"id": "sec-1", "num": "1", "level": 1, "title": "The problem and the thesis", "raw_title": "1. The problem and the thesis", "parent": null, "part": "1", "html": "<p>Online and in research there is a great deal of discussion about\ncompanion AI, and specifically about the harms its use poses to young\npeople. These conversations fail to agree on one thing: what exactly\n<em>is</em> companion AI?</p>\n<p>This part sets out why the question matters before setting out the\nproblem. §1.1 establishes the developmental stakes — that close\nrelationships are the strongest known predictor of lifelong health and\nhappiness, and that adolescence is when the capacities they require are\nbuilt. §1.2 describes the definitional problem, §1.3 states the thesis,\nand §1.4 explains the paper’s preferred term. §1.5 sets out what the\nevidence currently says about benefits and risks, and shows that both\nrun through design functions rather than product categories — which is\nthe first indication that the definitional question and the\ndevelopmental question are the same question.</p>\n", "refs": ["1.1", "1.2", "1.3", "1.4", "1.5"], "newFlags": 0, "words": 143, "people": []}, {"id": "sec-1-1", "num": "1.1", "level": 2, "title": "Why this is a question about human flourishing", "raw_title": "1.1 Why this is a question about human flourishing", "parent": "sec-1", "part": "1", "html": "<p>The Harvard Study of Adult Development, the longest-running\nlongitudinal study of adult life ever conducted, has followed\nparticipants for more than eight decades. Its central finding is that\nthe quality of people’s relationships was the strongest predictor of\ntheir health and happiness across the lifespan — outperforming wealth,\nfame, social class, and even genes (Waldinger &amp; Schulz, 2023).</p>\n<p>The epidemiological evidence points the same way. A meta-analysis of\n148 studies covering more than 300,000 participants found that people\nwith strong social relationships had significantly greater odds of\nsurvival over time, an effect comparable in magnitude to quitting\nsmoking and larger than the effects of obesity or physical inactivity\n(Holt-Lunstad, Smith &amp; Layton, 2010). Psychology treats this not as\na preference but as a fundamental human need: the drive to form and\nmaintain lasting, positive bonds is as basic to human functioning as\nhunger (Baumeister &amp; Leary, 1995).</p>\n<p>The absence of connection is now a matter of public health policy.\nThe U.S. Surgeon General’s 2023 advisory declared loneliness and\nisolation an epidemic, and the specific magnitudes are worth stating\nrather than gesturing at: social isolation increases the risk of\npremature mortality by 29%, of heart disease by 29%, and of stroke by\n32%, and raises the risk of developing dementia by approximately 50%.\nAdults who experience frequent loneliness are more than twice as likely\nto develop depression (Office of the U.S. Surgeon General, 2023). These\nare not effects at the margin of wellbeing; they are effects on the same\nscale as the major modifiable risk factors that public health spends\nbillions to address. [NEW — figures verified directly against the\nadvisory’s published fact cards. Note that the widely repeated\ncomparison to “smoking 15 cigarettes a day” does not appear in the\nadvisory; the smoking comparison belongs to Holt-Lunstad’s meta-analysis\nand should be cited there.]</p>\n<p>If relationships are the foundation of a good life, adolescence is\nwhen that foundation is poured. Developmental research identifies the\nadolescent years as a critical window in which core socio-emotional\ncapacities — emotional regulation, conflict resolution,\nperspective-taking, boundary-setting — are built through emotionally\ncharged, person-to-person interaction (Figueroa et al., 2026). The\nrelational skills and expectations young people develop in this period\nbecome the template for the adult relationships they go on to form: the\nfriendships, partnerships, families and communities that decades of\nevidence tell us will, more than almost anything else, determine how\ntheir lives go.</p>\n<p>Young people are also at the forefront of the AI transition. These\ntechnologies have matured alongside Generation Z and Generation Alpha;\nyouth and artificial intelligence have, in a sense, grown up together,\nand that simultaneity has shaped how young people write, create, and\nconnect. A technology that intervenes in adolescent relational practice\ntherefore intervenes at a developmentally load-bearing point. That is\nthe premise of this paper, and it is why a definitional question is not\nmerely a terminological one: what we decide to call these systems\ndetermines which of them we examine at all.</p>\n", "refs": [], "newFlags": 1, "words": 504, "people": []}, {"id": "sec-1-2", "num": "1.2", "level": 2, "title": "The definitional problem", "raw_title": "1.2 The definitional problem", "parent": "sec-1", "part": "1", "html": "<p>The term is used to mean at least four different objects. It refers\nto dedicated conversational apps built around a persona (Replika,\nCharacter.AI, Nomi, Kindroid). It refers to general-purpose assistants\nused relationally (ChatGPT, Gemini, Claude). It refers to embodied or\nhumanoid devices that incorporate AI. And in survey instruments it\nfrequently refers to all of these at once, collapsed into a single\nmeasured category.</p>\n<p>The definition determines what gets counted, what gets studied, and\nwhat gets regulated. A survey that defines companions as dedicated apps\nand a survey that defines them as any conversational agent are measuring\ndifferent populations, and will produce different prevalence figures,\ndifferent harm profiles and different policy recommendations — while\nappearing to describe the same phenomenon. §3.5 shows that this has\nalready happened: the three largest youth-usage surveys measure three\ndifferent objects, and their headline figures are routinely quoted side\nby side as though they did not.</p>\n", "refs": ["3.5"], "newFlags": 0, "words": 154, "people": []}, {"id": "sec-1-3", "num": "1.3", "level": 2, "title": "The thesis", "raw_title": "1.3 The thesis", "parent": "sec-1", "part": "1", "html": "<p>This paper addresses the definitional problem underlying debates\nabout companion AI and youth by defining companionship through\n<strong>functions rather than product categories</strong>, and\ndemonstrating how that definition operates in practice.</p>\n<p>The relational risks that motivate concern — anthropomorphism,\npersistent memory, sycophancy, constant availability — live in design\nfunctions, not in a product class. A rule framed around a special\ncategory of companion product will therefore miss most actual use. This\nis the argument developed across §5, §6 and §7: the companies’ own\nmarketing copy shows the four defining features distributed across the\nwhole product spectrum, chosen independently of what each product calls\nitself, and the statutes have begun to converge on functional tests\nwithout agreeing on which functions.</p>\n", "refs": ["5", "6", "7"], "newFlags": 0, "words": 116, "people": []}, {"id": "sec-1-4", "num": "1.4", "level": 2, "title": "Why \"companion AI\" rather than \"AI companion\"", "raw_title": "1.4 Why \"companion AI\" rather than \"AI companion\"", "parent": "sec-1", "part": "1", "html": "<p>The noun phrase <em>AI companion</em> implies a discrete thing — an\napp you download. That implication is precisely what the evidence in §5\nundermines. Throughout this paper the preferred term is\n<strong>companion AI</strong>, treating companionship as a modifier\ndescribing how a system functions rather than a category naming what it\nis. Where <em>AI companion</em> appears, it is because a cited source\nuses it.</p>\n", "refs": ["5"], "newFlags": 0, "words": 62, "people": []}, {"id": "sec-1-5", "num": "1.5", "level": 2, "title": "What the evidence says about benefits and risks", "raw_title": "1.5 What the evidence says about benefits and risks", "parent": "sec-1", "part": "1", "html": "<p>The evidence on youth engagement with AI is genuinely two-sided, and\nthe benefits deserve to be stated plainly rather than conceded in a\nsubordinate clause.</p>\n<p><strong>The benefits.</strong> A Harvard Business School study found\nthat interacting with an AI companion alleviated loneliness to a degree\non par with interacting with another person, and more than activities\nsuch as watching videos, with “feeling heard” identified as the\nmechanism (De Freitas et al., 2026). They can build transferable social\nskills: two in five teen users report applying skills practised with AI\n— starting conversations, giving advice, expressing emotions — to their\nreal lives (Common Sense Media, 2025), and clinicians describe\ncompanions as a low-stakes space to rehearse interactions that might\notherwise feel overwhelming (Andoh, 2026). They can extend access: for\nteens who are rural, disabled, LGBTQIA+, or without counselling\nresources, AI may offer information and guidance when no local\nalternative exists (Figueroa et al., 2026). They offer a low-risk space\nfor identity exploration during the developmental window when that task\nmatters most, and early evidence suggests co-use can support family\nbonding (Sun, Wang &amp; McDaniel, 2026). Academically, the same systems\nfunction as always-available tutors and homework support — part of why\nthey have become so embedded in young people’s daily lives, and, as §5.3\nargues, the doorway through which the relational uses arrive.</p>\n<p><strong>The risks.</strong> These are documented across the same\ndevelopmental domains. Behaviourally, an analysis of teens’ own accounts\nidentified all six components of behavioural addiction — salience,\ntolerance, withdrawal, conflict, relapse and mood modification — in\nadolescent Character.AI use (Namvarpour &amp; Razi, 2026).\nSocio-emotionally, experimental work shows that sycophantic AI reduces\nwillingness to repair interpersonal conflict while increasing users’\nconviction of being right (Cheng et al., 2025); a four-week randomised\ncontrolled trial found heavier voluntary chatbot use associated with\nworse loneliness, dependence and problematic use regardless of design\ncondition (Fang et al., 2025); and AI romantic companion use among\npartnered young adults correlates with lower relationship stability and\npoorer communication (Wheatley Institute, 2026). Academically, cognitive\noffloading is a live concern (Shirky, 2026).</p>\n<p>Figueroa et al. identify two developmental pathways by which this\ncould operate. The first is <strong>relational\ndisplacement</strong>:</p>\n<blockquote>\n<p>“When interactional AI provides constant availability and validation,\nit may reduce engagement in the interactions where relational\ncompetencies develop, limiting opportunities to build skills that\nprotect against depression, anxiety, and loneliness. Relational\ndisplacement can occur in subtle ways… Missing out on small moments of\nconnection may increase adolescents’ vulnerability to social withdrawal,\nloneliness, and depression.” (Voice: Figueroa et al., Interactional AI\nand adolescence)</p>\n</blockquote>\n<p>The second is <strong>maladaptive relational learning</strong>:</p>\n<blockquote>\n<p>“AI systems that consistently validate adolescents’ interpretations\nand model asymmetrical availability may normalise expectations that\nhuman relationships cannot meet. Although this validation may reduce\ndistress in the moment, repeated reliance may reinforce maladaptive\npatterns… These patterns may carry into peer and romantic relationships,\nundermining adolescents’ ability to form and sustain healthy\nrelationships.” (Voice: Figueroa et al., Interactional AI and\nadolescence)</p>\n</blockquote>\n<p>Both mechanisms are functional rather than categorical. Constant\navailability, consistent validation and asymmetrical reciprocity are\ndesign properties, and none of them requires a product to be labelled a\ncompanion. That is the first indication that the definitional question\nand the developmental question are the same question.</p>\n<p>Research here is still emerging, and several threads remain\nunderdeveloped — in particular how companion AI and chat models affect\nrelationships through the lens of gender identity, sexuality and race\n(Common Sense Media, 2025; Wheatley Institute, 2026).</p>\n<p>Close human relationships are the strongest predictor of lifelong\nhealth and happiness, and adolescence is the period in which the\ncapacities those relationships require — conflict repair,\nperspective-taking, tolerance for the messiness of other minds — are\nbuilt through practice. A technology that intervenes in that practice\nintervenes in the foundation. Whether companion AI ultimately scaffolds\nthat development or substitutes for it is not only a question of\nindividual wellbeing but of societal capacity: a generation’s ability to\nform the bonds on which families, communities and civic life depend.</p>\n", "refs": ["5.3"], "newFlags": 0, "words": 661, "people": []}, {"id": "sec-2", "num": "2", "level": 1, "title": "How young people actually use these tools", "raw_title": "2. How young people actually use these tools", "parent": null, "part": "2", "html": "<p>The usage evidence is the empirical ground for the argument. It shows\nthat the tools young people use for companionship are overwhelmingly\n<em>not</em> the tools that companion-specific policy targets.</p>\n", "refs": [], "newFlags": 0, "words": 30, "people": []}, {"id": "sec-2-1", "num": "2.1", "level": 2, "title": "Prevalence", "raw_title": "2.1 Prevalence", "parent": "sec-2", "part": "2", "html": "<p>Thorn’s 2025 annual survey of 1,003 US minors aged 9–17, weighted to\nCensus benchmarks for age, gender, race and geography, found that a\nmajority had used one of these tools.</p>\n<blockquote>\n<p>“An AI chatbot or companion is a computer program that you can text\nor talk with whenever you want, like ChatGPT or Character AI. Have you\never used an AI chatbot or companion?” (Voice: Thorn, Youth-safety\nresearch)</p>\n</blockquote>\n<p>Sixty-seven percent of minors answered yes; 6% were unsure and 27%\nsaid no. Broken down by age, 73% of teens aged 13–17 had used one, and\n60% of preteens aged 9–12. By race and ethnicity, Hispanic or Latino/a/x\nyouth reported the highest rate at 74%, African American youth 70%,\nWhite youth 64%, and other youth of colour 62% (Thorn, 2026, Fig 5A,\np. 14).</p>\n<p>A separate survey by Common Sense Media of 1,060 teens aged 13–17\nfound that 72% had used AI companions at least once, 52% were regular\nusers interacting at least a few times a month, and about 13% used them\ndaily; one in four had never used one (Latifi, 2025).</p>\n<p>Pew Research Center surveyed 1,458 US teens aged 13–17 between 25\nSeptember and 9 October 2025, with a margin of error of ±3.3 points, and\nfound that 16% had used chatbots to have casual conversations and 12% to\nget emotional support or advice. Pew notes that majorities of teens\nreport <em>not</em> doing these things: information-seeking (57%) and\nschoolwork (54%) remain the dominant uses. [NEW — figures and\nmethodology verified directly against the Pew report; the draft cited\nthe percentages without the base or the countervailing context.]</p>\n", "refs": [], "newFlags": 1, "words": 280, "people": ["thorn"]}, {"id": "sec-2-2", "num": "2.2", "level": 2, "title": "Which tools they use", "raw_title": "2.2 Which tools they use", "parent": "sec-2", "part": "2", "html": "<p>This is the pivotal finding. Among minors who had used an AI chatbot\nor companion, Thorn recorded the following (Fig 5B, p. 14):</p>\n<ul>\n<li>ChatGPT — 78%</li>\n<li>Gemini — 41%</li>\n<li>Meta AI / Llama — 28%</li>\n<li>My AI (Snapchat) — 16%</li>\n<li>Character AI — 15%</li>\n<li>Grok — 8%</li>\n<li>Instagram Discover AIs — 6%</li>\n<li>Claude — 3%</li>\n<li>Replika — 2%</li>\n<li>CHAI — 2%</li>\n<li>Chub AI — 1%</li>\n<li>Nomi — 1%</li>\n<li>AI chatbots or companions on another social media platform — 1%</li>\n<li>Other — 2%</li>\n</ul>\n<p>The question was multiple select, so these proportions describe reach\namong users and cannot be summed. The pattern is nonetheless\nunambiguous: dedicated companion apps sit far below general-purpose\nassistants. Every product that companion-specific regulation names\nreaches fewer than one in six AI-using minors. The product reaching four\nin five is an assistant.</p>\n", "refs": [], "newFlags": 0, "words": 122, "people": []}, {"id": "sec-2-3", "num": "2.3", "level": 2, "title": "What they use them for", "raw_title": "2.3 What they use them for", "parent": "sec-2", "part": "2", "html": "<p>Among minors who had used one of these tools, Thorn asked about\ncontext of use (Fig 5C, p. 15):</p>\n<ul>\n<li>Talking or getting advice about romantic feelings or relationships —\n31%</li>\n<li>Asking for help or support for something scary or confusing that\nhappened to me — 31%</li>\n<li>Asking for help or support for something scary or confusing that\nhappened to someone else — 29%</li>\n<li>Looking for information or advice about puberty or sexual health —\n26%</li>\n<li>Having flirty, romantic, or sexual conversations — 11%</li>\n<li>I haven’t used one in any of these ways — 39%</li>\n</ul>\n<p>Thorn additionally found that 15% of minors who had experienced\nonline sexual harm sought advice from an AI chatbot or companion\nafterwards, more than twice the rate at which they turned to some other\nsources. [NEW — drawn from Thorn’s disclosure chapter, which the draft\ndid not reach.]</p>\n<p>Common Sense Media found that 33% of surveyed teens used AI\ncompanions for social interaction and relationships, a category it\ndefined as including “conversation practice, emotional support,\nrole-playing, friendship, or romantic interactions” (Latifi, 2025).\nThirty-one percent found conversations with AI companions as satisfying\nor more satisfying than those with real-life friends. Countervailing\nfindings in the same survey: 80% of AI companion users reported spending\nmore time with friends than with AI companions against 6% reporting the\nopposite, and two in five applied a skill practised with AI in real\nlife.</p>\n<p>These are companionship functions — confiding, seeking comfort,\nrehearsing intimacy, asking the questions you would ask a trusted older\nfriend. They are being performed at scale, and mostly not inside\nproducts labelled as companions.</p>\n", "refs": [], "newFlags": 1, "words": 263, "people": []}, {"id": "sec-2-4", "num": "2.4", "level": 2, "title": "The mismatch between use and regulatory attention", "raw_title": "2.4 The mismatch between use and regulatory attention", "parent": "sec-2", "part": "2", "html": "<p>An earlier draft of this section asserted that “chatbots appear to be\nthe most prevalent form of AI companionship” and that “current policy\nand policy proposals nonetheless target dedicated companion apps.” Both\nhalves need qualifying, and one of them needs replacing.</p>\n<p><strong>On prevalence.</strong> Thorn’s Fig 5B measures which tools\nminors have <em>used</em>, not which they use <em>for\ncompanionship</em>, and Fig 5C’s context-of-use figures are not broken\ndown by tool. So the direct claim is not evidenced: no instrument in\nthis corpus establishes where relational use is happening. What the data\ndoes support is a residual argument. Sixty percent of AI-using minors\nreport at least one of Thorn’s five relational uses. The dedicated\ncompanion apps in Fig 5B — Character AI, Replika, CHAI, Chub AI, Nomi —\nhave a combined reach of at most 21%, since multiple-select shares\ncannot exceed their sum. At least 39 percentage points of relational use\ntherefore belongs to minors who use no dedicated companion app at all:\nroughly a quarter of all US minors aged 9–17. Counting persona features\ninside social platforms as companion products — My AI and Instagram\nDiscover AIs — raises the ceiling to 43% and lowers the floor to 17\npoints, around one in nine of all minors. The claim survives under\neither reading, as a floor rather than a comparison.</p>\n<p>What cannot be said on this evidence is that assistants are the\n<em>predominant</em> venue for companionship, because intensity per user\nis unmeasured and plausibly runs the other way: nearly every Replika\nuser is presumably there for companionship, while most ChatGPT users are\nnot.</p>\n<p><strong>On regulation.</strong> The claim that policy targets\ndedicated companion apps is, as a matter of statutory text, largely\nfalse. §7.4 sets out the definitions: most of these instruments define\ntheir object by design features rather than product class, and\nCalifornia’s may already reach ChatGPT. The defensible version is\nnarrower and more interesting — the instruments define companionship\nfunctionally but each picks a different feature set, and several\nreintroduce classification by self-presentation through their\ncarve-outs. Defining companion AI by design features does not by itself\nclose the gap, because the drafters are already doing that; what closes\nit is agreeing on which features, and refusing to exempt by marketing.\nThe instruments are examined in §7.4.</p>\n", "refs": ["7.4"], "newFlags": 0, "words": 384, "people": []}, {"id": "sec-3", "num": "3", "level": 1, "title": "The definitional landscape in the literature", "raw_title": "3. The definitional landscape in the literature", "parent": null, "part": "3", "html": "<p>In current research, what designates an “AI companion” is vague, and\nthe vagueness is not evenly distributed — different authors draw the\nline in different places, and several draw a line they then cross.</p>\n", "refs": [], "newFlags": 0, "words": 33, "people": []}, {"id": "sec-3-1", "num": "3.1", "level": 2, "title": "Andoh: the assistant/companion distinction", "raw_title": "3.1 Andoh: the assistant/companion distinction", "parent": "sec-3", "part": "3", "html": "<p>Writing in the APA’s <em>Monitor on Psychology</em>, Efua Andoh draws\nthe cleanest available distinction, resting it on design intent around\nromance.</p>\n<blockquote>\n<p>“The essential distinction between the assistant chatbots—which are\nsometimes used as digital friends—and companion AI chatbots is that the\nlatter have been specifically designed to initiate and maintain romantic\nrelationships.” (Voice: Efua Andoh, APA Monitor on Psychology)</p>\n</blockquote>\n<p>The distinction is useful and this paper retains it for clarity. But\nnote what the parenthesis concedes: assistant chatbots are “sometimes\nused as digital friends.” The functional overlap is admitted in the same\nsentence that separates the categories.</p>\n<p>More telling still, Andoh cannot hold the line across the length of\nher own article. She writes of “a chatbot assistant used as a digital\ncompanion,” and of “the Meta AI companions or chatbots being used as\ncompanions.” [NEW — this observation is mine, from close reading of the\nAndoh article; it is not in the draft.] The category keeps needing a\nhyphenated escape clause because the function does not respect the\nproduct boundary.</p>\n<p>Andoh’s article also supplies context worth citing directly: between\n2022 and mid-2025 the number of AI companion apps surged by 700%;\nCharacter.AI has 20 million monthly users, more than half under the age\nof 24; and a Harvard Business Review analysis identified therapy and\ncompanionship as the top two reasons people use generative AI tools at\nall. [NEW]</p>\n", "refs": [], "newFlags": 2, "words": 233, "people": ["andoh"]}, {"id": "sec-3-2", "num": "3.2", "level": 2, "title": "Bernardi: companions as a subset of assistants", "raw_title": "3.2 Bernardi: companions as a subset of assistants", "parent": "sec-3", "part": "3", "html": "<p>In a blog post for the Ada Lovelace Institute, Jamie Bernardi treats\ncompanions as a subset rather than a separate species.</p>\n<blockquote>\n<p>“digital personas designed to provide emotional support, show empathy\nand proactively ask users personal questions through text, voice notes\nand pictures” (Voice: Jamie Bernardi, Ada Lovelace Institute)</p>\n</blockquote>\n<p>Bernardi’s framing is structurally different from Andoh’s. If\ncompanions are a <em>subset</em> of assistants, then the boundary is a\nmatter of degree along shared dimensions, not a difference in kind —\nwhich is closer to the position this paper argues for, and sits uneasily\nbeside the categorical distinction in §3.1.</p>\n", "refs": ["3.1"], "newFlags": 0, "words": 100, "people": ["bernardi"]}, {"id": "sec-3-3", "num": "3.3", "level": 2, "title": "Sun et al.: four design features", "raw_title": "3.3 Sun et al.: four design features", "parent": "sec-3", "part": "3", "html": "<p>Sun, Wang and McDaniel, writing in <em>Child Development\nPerspectives</em>, define companion AI by design features rather than by\nproduct identity.</p>\n<blockquote>\n<p>“memorize past information… hold in-depth and coherent conversations,\nemulate empathy, and provide personalized humanlike companionship with\nconstant responsiveness in real time” (Voice: Sun et al., Child\nDevelopment Perspectives)</p>\n</blockquote>\n<p>Reduced to four features, this gives: <strong>persistent\nmemory</strong>, <strong>emotional responsiveness</strong>,\n<strong>anthropomorphism</strong>, and <strong>constant\navailability</strong>. This is the definitional core adopted by this\npaper, because it is the only one of the five in this section that can\nbe applied to a product without first asking the company what kind of\nproduct it is.</p>\n", "refs": [], "newFlags": 0, "words": 102, "people": ["sun"]}, {"id": "sec-3-4", "num": "3.4", "level": 2, "title": "McStay: intimate functionality as emulated empathy", "raw_title": "3.4 McStay: intimate functionality as emulated empathy", "parent": "sec-3", "part": "3", "html": "<p>Andrew McStay, writing in <em>Tech Policy Press</em>, states the\nregulatory bind that follows from the definitional problem more\nprecisely than anyone else in this literature.</p>\n<blockquote>\n<p>“If we draw the line narrowly, around sexual role-play, the intimate\nfunctionality rule will miss the general assistant a teenager treats as\na confidant. Draw it broadly, around ‘companionship’ or ‘emotional\nsupport,’ and we then have to define empathic design itself in a\nstatute, which is an extraordinarily hard thing to write.” (Voice:\nAndrew McStay, Tech Policy Press)</p>\n</blockquote>\n<p>McStay’s own answer is to name the functional property precisely:\n<strong>intimate functionality understood as emulated empathy</strong> —\nthe design property of appearing to possess strong human empathy while\nhaving only weak empathy, sensing and responding to emotional states\nwithout felt experience. He proposes that regulators adopt IEEE\n7014.1-2026, “Ethical Considerations of Emulated Empathy,” rather than\ninventing a statutory definition from scratch; the standard carries 29\npractical recommendations including disclosure of weak empathy,\ndependency detection, and steering distressed users toward human\nsupport. [NEW — the draft cites McStay for the bind but not for his\nproposed resolution, which is the part that most directly supports the\nthesis in §7.5.]</p>\n<p>This is a rival functional definition to Sun et al.’s, and a narrower\none: emulated empathy is roughly Sun et al.’s second feature,\nload-bearing on its own. A paper arguing for functional definition\nshould say which functional definition it means, and why four features\nrather than one.</p>\n", "refs": ["7.5"], "newFlags": 1, "words": 244, "people": ["mcstay"]}, {"id": "sec-3-5", "num": "3.5", "level": 2, "title": "How the surveys define the category", "raw_title": "3.5 How the surveys define the category", "parent": "sec-3", "part": "3", "html": "<p>The three largest youth-usage surveys each define the object\ndifferently, and two of the three define it by pointing at one assistant\nand one companion app in the same breath.</p>\n<p>Thorn collapses the distinction entirely, measuring “an AI chatbot or\ncompanion . . . a computer program that you can text or talk with\nwhenever you want, like ChatGPT or Character AI.”</p>\n<p>Pew uses the umbrella term “AI chatbots,” glossed as “chatbots like\nChatGPT, Copilot and Character.ai.”</p>\n<blockquote>\n<p>“chatbots like ChatGPT, Copilot and Character.ai” (Voice: Pew\nResearch Center, Youth survey research)</p>\n</blockquote>\n<p>Common Sense Media, by contrast, defines companions <em>against</em>\nassistants.</p>\n<blockquote>\n<p>“AI companions are like digital friends or characters you can text or\ntalk with whenever you want. Unlike regular AI assistants that mainly\nanswer questions or do tasks, these companions are designed to have\nconversations that feel personal and meaningful” (Voice: Common Sense\nMedia, Children’s media watchdog)</p>\n</blockquote>\n<p>Three instruments, three objects. Thorn’s 67% and Common Sense\nMedia’s 72% are not measuring the same thing, and neither is Pew’s 16%.\n[NEW — this comparison is mine; it is the single strongest piece of\nevidence in the corpus that the definitional problem has already\ncontaminated the empirical base, and it deserves to be in the\npaper.]</p>\n<p>Note also the journalistic layer. Teen Vogue reported the Common\nSense Media study — the one survey that explicitly excludes assistants —\nunder a headline and gloss that reinstate them: “When it comes to AI\ncompanions like ChatGPT and Google’s Gemini, most teens have used them\nin some way.” The URL slug reads\n<em>teens-are-turning-to-chatgpt-for-social-interaction</em>. The\ndefinitional collapse happens in transit from report to reader.\n[NEW]</p>\n", "refs": [], "newFlags": 2, "words": 277, "people": ["csm", "pew"]}, {"id": "sec-3-6", "num": "3.6", "level": 2, "title": "What the lack of consensus costs", "raw_title": "3.6 What the lack of consensus costs", "parent": "sec-3", "part": "3", "html": "<p>The absence of a shared definition blurs the regulatory space, as §7\nshows. It also makes the research base non-cumulative: prevalence\nfigures cannot be compared, harm findings cannot be pooled, and a\npolicymaker reading three studies will reasonably conclude that between\n16% and 72% of teenagers have an AI companion.</p>\n<p>This paper defines companion AI by design features close to Sun et\nal.’s, while retaining Andoh’s app-versus-general distinction as a\ndescriptive convenience rather than a definitional boundary — a choice\nthat §6 puts under pressure.</p>\n", "refs": ["6", "7"], "newFlags": 0, "words": 89, "people": []}, {"id": "sec-4", "num": "4", "level": 1, "title": "What companionship means between humans", "raw_title": "4. What companionship means between humans", "parent": null, "part": "4", "html": "<p>Before asking whether an AI is a companion, it is worth being precise\nabout what the human word carries. The goal here is not an empirical\nclaim about how relationships work; it is to establish a commonsense,\nlived vocabulary of the forms companionship takes, precisely in order to\nshow AI tools sliding across them.</p>\n", "refs": [], "newFlags": 0, "words": 54, "people": []}, {"id": "sec-4-1", "num": "4.1", "level": 2, "title": "The dictionary baseline", "raw_title": "4.1 The dictionary baseline", "parent": "sec-4", "part": "4", "html": "<p>The <em>Oxford English Dictionary</em> defines a companion as:</p>\n<blockquote>\n<p>“A person who often spends time with another; a person one chooses to\nsocialize or associate with, a friend.” (Voice: Oxford English\nDictionary, Lexicography)</p>\n</blockquote>\n<p>Companionship is “the fact or state of being companions; association,\nfellowship.” A friend is “a person with whom one has developed a close\nand informal relationship of mutual trust and intimacy; (more generally)\na close acquaintance.”</p>\n", "refs": [], "newFlags": 0, "words": 68, "people": ["oed"]}, {"id": "sec-4-2", "num": "4.2", "level": 2, "title": "The range of companionship roles", "raw_title": "4.2 The range of companionship roles", "parent": "sec-4", "part": "4", "html": "<p><em>Companion</em> and <em>friend</em> are umbrella terms covering\nmany roles with different expectations. Friendship spans acquaintance to\nclose friend and shades into romantic partner, mentor, confidant, study\npartner, and therapist-like support.</p>\n<p>A widely circulated popular taxonomy distinguishes four grades of\nfriendship: <strong>acquaintances</strong>, encountered regularly but\nengaged at surface level, giving belonging without depth; <strong>casual\nfriends</strong>, built on shared interests or activities, often serving\na specific purpose; <strong>close friends</strong>, defined by emotional\nintimacy and trust; and <strong>lifelong friends</strong>, bonds built\nthrough years of shared experience and memory (Gupta, Verywell\nMind).</p>\n<p>Broader relationship categories include the\n<strong>familial</strong>, the <strong>platonic</strong>, the\n<strong>romantic or sexual</strong>, and the\n<strong>professional</strong> — colleagues, mentors, and role-based\nfigures such as educators and therapists (Goodson, Medium).</p>\n<p>Neither source is peer-reviewed, and neither is used here as an\nempirical claim; see Appendix B on how they are handled. Their function\nis vocabulary, which is what this section needs.</p>\n", "refs": [], "newFlags": 0, "words": 149, "people": []}, {"id": "sec-4-3", "num": "4.3", "level": 2, "title": "Reciprocity: what AI cannot supply", "raw_title": "4.3 Reciprocity: what AI cannot supply", "parent": "sec-4", "part": "4", "html": "<p>Both human definitions encode reciprocity. The OED describes a\ncompanion as “a person one chooses to socialize or associate with,” and\nfriendship as involving “mutual trust and intimacy.” Both presuppose two\nparties who each give and receive.</p>\n<p>The companion-traits list — emotional support, empathy,\nresponsiveness, personalization, memory — maps almost perfectly onto\nwhat the AI products advertise, with one difference: in the human\ndefinition these are mutual, and in the AI case they flow in one\ndirection only. The acts of companionship cannot be reciprocated, and\nthe relationship is ultimately one-sided.</p>\n<p>This is the asymmetry young users most need to understand, and it is\nalso where the strongest empirical concerns cluster. Andoh reports\nresearch finding that reliance on these tools risks “the potential\ntransformation of relational norms in ways that may render human-human\nconnection less accessible or less fulfilling,” and quotes the\ncounselling psychologist Saed D. Hill: “AI companions are always\nvalidating, never argumentative, and they create unrealistic\nexpectations that human relationships can’t match.” [NEW]</p>\n<p>There are real reasons young people turn to these tools, and the\nhonest version of the argument has to hold both. Interactional AI offers\nsomething historically unavailable: non-judgmental, always-available\nsupport for adolescents navigating complex and sometimes embarrassing\nrelational experiences. A Harvard Business School study found that\ninteracting with an AI companion alleviated loneliness to a degree on\npar with interacting with another person and more than activities such\nas watching videos, with “feeling heard” identified as the mechanism.\n[NEW] The same literature finds that heavy daily use correlates with\n<em>increased</em> loneliness, and that voice interaction reduced\nloneliness and problematic dependence more effectively than text only at\nmoderate use.</p>\n", "refs": [], "newFlags": 2, "words": 277, "people": []}, {"id": "sec-5", "num": "5", "level": 1, "title": "How the tools describe themselves", "raw_title": "5. How the tools describe themselves", "parent": null, "part": "5", "html": "<p>If companionship is a set of design features rather than a product\nclass, the companies’ own copy is the place to test it. This section\ntreats marketing language as primary evidence of self-description —\nevidence of what a company claims, never of what a product does. See\nAppendix B.</p>\n", "refs": [], "newFlags": 0, "words": 49, "people": []}, {"id": "sec-5-1", "num": "5.1", "level": 2, "title": "The dedicated companion apps", "raw_title": "5.1 The dedicated companion apps", "parent": "sec-5", "part": "5", "html": "<p>Popular dedicated apps include Replika, Character.AI, Nomi, Talkie,\nPolybuzz, Chai and Kindroid (Transparency Coalition).</p>\n<p>Replika embraces the framing outright, and names the relationship\nmenu explicitly.</p>\n<blockquote>\n<p>“Replika is your personal chatbot companion powered by artificial\nintelligence! Replika is the AI for anyone who wants a friend with no\njudgment, drama, or social anxiety involved.” (Voice: Replika, Companion\napp)</p>\n</blockquote>\n<p>Its copy runs through all four features: relationship selection\n(“Virtual girlfriend or boyfriend, friend, mentor?”), memory and\ndevelopment (“watch them develop their own personality &amp; memories\nalongside you”), emotional support (“If you’re feeling down, anxious, or\njust need someone who truly listens, your Replika is there for you\n24/7”), and constant availability.</p>\n<p>Kindroid leads on memory and growth.</p>\n<blockquote>\n<p>“Your AI friend who listens, remembers, and grows with you everyday”\n(Voice: Kindroid, Companion app)</p>\n</blockquote>\n<p>Nomi foregrounds persistence and non-judgment.</p>\n<blockquote>\n<p>“Each Nomi is a completely unique AI companion that fosters\nentertaining, meaningful, and enduring conversations as they pick up on\nand remember all the little details that make your relationship yours.”\n(Voice: Nomi, Companion app)</p>\n</blockquote>\n<p>Character.AI is the surprise. The paradigm companion app in the\nliterature resists companion framing entirely, describing itself as a\nplatform that “empowers people to connect, learn, and tell stories\nthrough interactive entertainment,” organised around four pillars:\nLimitless Entertainment, Neverending Ways to Create, Unbounded\nConnection, and Endless Exploration.</p>\n<blockquote>\n<p>“empowers people to connect, learn, and tell stories through\ninteractive entertainment” (Voice: Character.AI, Companion app)</p>\n</blockquote>\n<p>The functional description comes from outside the company. Camille\nCarlton of the Center for Humane Technology describes what the product\ndoes:</p>\n<blockquote>\n<p>“The Character.ai app creates an immersive role-playing environment,\nwith chatbots simulating human-like conversation. However, this chat\nexperience often blurs the lines between fantasy and reality,\nparticularly for younger users. Conversations with Character.ai bots can\ninvolve detailed descriptions of emotions and actions, fostering a sense\nof connection and trust that feels real to users. The conversations also\nhave few to no time limits, allowing users to interact with Character.ai\nbots for hours.” (Voice: Camille Carlton, Center for Humane\nTechnology)</p>\n</blockquote>\n<p>All four features, described by a third party, in a product whose own\ncopy says “entertainment.”</p>\n", "refs": [], "newFlags": 0, "words": 357, "people": ["carlton", "characterai", "kindroid", "nomi", "replika"]}, {"id": "sec-5-2", "num": "5.2", "level": 2, "title": "The boundary cases: Pi and Copilot", "raw_title": "5.2 The boundary cases: Pi and Copilot", "parent": "sec-5", "part": "5", "html": "<p>Pi is the cleanest boundary-breaker. Its copy fuses assistant tasks\nwith companion affect and names itself neither.</p>\n<blockquote>\n<p>“Conversations with emotional intelligence: Vent, think out loud,\nprep for a hard conversation, or just chat. Pi meets you wherever you\nare.” (Voice: Pi, Inflection AI)</p>\n</blockquote>\n<p>Alongside that sit reminders and to-dos (“Take control of your daily\nlife”), “Learn something new every day,” meal planning, and “Help with a\ndecision.” It calls itself “the world’s first personal intelligence” and\n“your personal intelligence partner”; the tagline is “Pi, the first\nemotionally intelligent AI.” Inflection AI describes itself as “the\nPublic Benefit Corporation empowering people and brands with\nhuman-centered, emotionally intelligent AI.”</p>\n<p>Pi is Exhibit A for the spectrum claim: companion features and\nassistant features advertised in the same breath, under a name that is\nneither.</p>\n<p>Copilot is the mirror image — an assistant reaching companion-ward.\nMicrosoft publishes a page titled “What is an AI companion?” and answers\nit with Copilot.</p>\n<blockquote>\n<p>“Microsoft Copilot stands out as a uniquely supportive AI companion\ndesigned to enhance productivity, creativity, and connection. More than\njust an AI assistant, Copilot combines advanced language understanding\nwith emotional intelligence features that allow it to adapt to\nindividual communication styles and offer thoughtful support across a\nwide range of tasks.” (Voice: Microsoft Copilot, General-purpose\nassistant)</p>\n</blockquote>\n<p>The page lists Copilot’s roles as productivity assistant,\nbrainstorming partner, coaching support, and “sounding board that helps\nyou talk through decisions or situations,” and claims an “ability to\nrecognize, interpret, and respond to human emotions.” Note the hedge —\n“more than just an AI assistant” — and the reach for “companion” and\n“connection” regardless.</p>\n", "refs": [], "newFlags": 0, "words": 270, "people": ["copilot", "pi"]}, {"id": "sec-5-3", "num": "5.3", "level": 2, "title": "The task-framed assistants", "raw_title": "5.3 The task-framed assistants", "parent": "sec-5", "part": "5", "html": "<p>By their own current copy, the three largest general assistants stay\ntask-framed.</p>\n<p>OpenAI’s ChatGPT page leads with “Now you can chat, work &amp; code\nall in one place,” and describes the product as help with “everyday\nquestions and ideas, explaining concepts, drafting messaging, searching\nthe web, generating an image, comparing options, or thinking through a\ndecision.”</p>\n<blockquote>\n<p>“Get help with everyday questions and ideas, explaining concepts,\ndrafting messaging, searching the web, generating an image, comparing\noptions, or thinking through a decision.” (Voice: OpenAI,\nGeneral-purpose assistant)</p>\n</blockquote>\n<p>Google’s Gemini page leads with “Building the world’s most capable AI\nassistant,” and continues: “Supercharge your creativity and productivity\nwith Google’s AI assistant. Brainstorm ideas, simplify complex topics,\nand rehearse for important moments.”</p>\n<blockquote>\n<p>“Supercharge your creativity and productivity with Google’s AI\nassistant. Brainstorm ideas, simplify complex topics, and rehearse for\nimportant moments.” (Voice: Google, General-purpose assistant)</p>\n</blockquote>\n<p>Two qualifications. “Rehearse for important moments” is a\ncompanionship function in task clothing — it is the\nrehearsal-of-intimacy use that Golden describes as “a low-stakes way to\npractice conversations with real people.” And Gemini’s feature-level\ncopy does reach for personalization: “Your Personal Agent,” and a Daily\nBrief that “understands your rhythms.” The task framing is real but not\nairtight. [NEW]</p>\n<p><strong>But task-framed copy does not produce task-limited\nuse.</strong> This is the point at which §5’s argument about\nself-description meets §2’s argument about behaviour. The role young\npeople occupy these systems in most heavily is the tutor: Pew finds 54%\nuse chatbots for schoolwork, the single largest use, and it is performed\noverwhelmingly by general assistants whose copy claims nothing\nrelational. That role is treated as benign, and so it is almost never\nstudied as a relational role — even though it is the role through which\nmost young people first form the habit of confiding in a system.</p>\n<p>The habit does not stay in its lane. Among the same population, 31%\nask an AI chatbot or companion for help with something scary or\nconfusing that happened to them, 33% report using AI companions for\nsocial interaction and relationships, and 31% find those conversations\nas satisfying as conversations with real friends. Twenty-nine percent\nseek support about something that happened to someone else, and 15% of\nminors who had experienced online sexual harm turned to a chatbot\nafterwards; Andoh reports 48.7% of adults with a mental health condition\nusing LLMs for mental health support. Thirty-one percent seek advice\nabout romantic feelings, 11% have flirty, romantic or sexual\nconversations, and the Center for Democracy and Technology finds nearly\none in five students have had, or have friends who have had, romantic\nrelationships with AI.</p>\n<p>Read as a sequence rather than a list, this is a progression, and it\nmatters for regulation. <strong>Young people do not begin with an AI\ngirlfriend.</strong> They begin with homework help, then advice, then\nconfiding — and the entry point is a product that describes itself as a\ntool for drafting and summarisation. The roles with the best evidence\nbehind them are the least discussed precisely because they look\nharmless, while the role that attracts nearly all companion-specific\nregulation — the romantic one — sits further along a path that begins\nsomewhere no companion rule reaches. A regime that regulates the\ndestination and ignores the doorway has misidentified where the\nintervention needs to be.</p>\n<p>Two honest limits. No survey breaks context-of-use down by product,\nso the progression is inferred from aggregate patterns rather than\nobserved in individuals; and none of these figures establishes that the\ntutoring use <em>causes</em> the confiding use. What they establish is\nthat both are happening in the same products, at scale, in a population\nfor whom the relational stakes are highest (§1.1).</p>\n<p>Anthropic’s launch announcement for Claude is the most austerely\ntask-framed of the set.</p>\n<blockquote>\n<p>“Claude is a next-generation AI assistant based on Anthropic’s\nresearch into training helpful, honest, and harmless AI systems.”\n(Voice: Anthropic, General-purpose assistant)</p>\n</blockquote>\n<p>The listed use cases are summarization, search, creative and\ncollaborative writing, Q&amp;A, and coding. [NEW — note that this is the\nMarch 2023 launch post rather than current product copy; §A.2 explains\nwhy the distinction matters.]</p>\n", "refs": ["1.1", "2", "5"], "newFlags": 2, "words": 703, "people": ["anthropic", "google", "openai"]}, {"id": "sec-5-4", "num": "5.4", "level": 2, "title": "Self-classification does not predict function", "raw_title": "5.4 Self-classification does not predict function", "parent": "sec-5", "part": "5", "html": "<p>Sorting the same nine products by how they frame themselves produces\nfour groups:</p>\n<ul>\n<li><strong>Embraces companion framing:</strong> Replika, Kindroid,\nNomi.</li>\n<li><strong>Resists it entirely:</strong> Character.AI — a paradigm\ncompanion app in the literature, calling itself interactive\nentertainment.</li>\n<li><strong>Fuses both, names itself neither:</strong> Pi — a general\nassistant by architecture, a companion by affect, marketed as “personal\nintelligence.”</li>\n<li><strong>Task-framed, with one outlier:</strong> ChatGPT, Gemini,\nClaude — with Copilot reaching companion-ward.</li>\n</ul>\n<p>Companies self-classify inconsistently, and their self-classification\ndoes not predict function. Character.AI performs companion functions\nwhile calling itself entertainment; Pi performs both while calling\nitself intelligence; Copilot is an assistant reaching for companion\nlanguage; Microsoft titles a page “what is an AI companion” and answers\nit with an assistant.</p>\n<p>If the companies themselves cannot hold Andoh’s assistant/companion\nline — if the paradigm companion app disavows the label while a general\nassistant claims the affect — the category cannot bear regulatory\nweight. The features are present across the spectrum and chosen\nindependently of what the product calls itself.</p>\n", "refs": [], "newFlags": 0, "words": 166, "people": []}, {"id": "sec-6", "num": "6", "level": 1, "title": "The companion index: applying the definition", "raw_title": "6. The companion index: applying the definition", "parent": null, "part": "6", "html": "<p>The definition adopted here is Sun et al.’s four features, with\nAndoh’s app/general distinction retained descriptively. This section\napplies it.</p>\n", "refs": [], "newFlags": 0, "words": 23, "people": []}, {"id": "sec-6-1", "num": "6.1", "level": 2, "title": "The four features across the product set", "raw_title": "6.1 The four features across the product set", "parent": "sec-6", "part": "6", "html": "<p>Character.AI, Replika, Nomi and Kindroid fulfil all four features and\nsit clearly on the companion-app side. These are unambiguous — Replika\neven lets a user set a relationship status.</p>\n<p>Pi fulfils all four by its own description, while marketing itself as\na personal-intelligence assistant. It is designed for companionship and\nframed as an assistant.</p>\n<p>Copilot shares the underlying category of Claude, ChatGPT and Gemini\nbut is marketed with the full companion vocabulary. The assistant\ncategory is therefore not uniform either.</p>\n<p>Read feature by feature, the assistants claim companion properties as\nloudly as the companion apps do. On <strong>emotional\nresponsiveness</strong>, Copilot markets “emotional intelligence\nfeatures” and the ability to “recognize, interpret, and respond to human\nemotions”; Pi’s stated purpose is empathetic support and companionship.\nOn <strong>memory</strong>, Kindroid “listens, remembers, and grows with\nyou,” Nomi remembers “all the little details,” Replika develops “their\nown personality &amp; memories alongside you,” and Copilot’s\npersonalization implies it. On <strong>anthropomorphism</strong>,\nReplika offers “virtual girlfriend or boyfriend, friend, mentor,”\nCharacter.AI simulates “human-like conversation,” Kindroid offers an “AI\nfriend” with “human-like voices,” Pi holds “human-like conversations.”\nOn <strong>constant availability</strong>, Replika is there “24/7” and\nCharacter.AI has “few to no time limits”; assistants do not foreground\nthis but structurally have it.</p>\n<p>The features Sun et al. use to define companions are present across\nthe assistant category too.</p>\n", "refs": [], "newFlags": 0, "words": 227, "people": []}, {"id": "sec-6-2", "num": "6.2", "level": 2, "title": "The label/function divergence", "raw_title": "6.2 The label/function divergence", "parent": "sec-6", "part": "6", "html": "<p>The four features track a spectrum, not a binary. Dedicated companion\napps max all four. General assistants vary: some stay task-framed by\ntheir own copy, while others adopt companion features by choice. That\nvariance <em>within</em> the assistant category is the cleanest\navailable evidence that companionship is a set of tunable design\nfeatures rather than a property of an app class.</p>\n<p>Plotting self-label against function separates the two cleanly, and\nthe interesting products are the ones off the diagonal — Character.AI,\nhigh function and low label; Copilot, moderate function and high label.\nSee §6.1 and the visualisation panel.</p>\n", "refs": ["6.1"], "newFlags": 0, "words": 100, "people": []}, {"id": "sec-6-3", "num": "6.3", "level": 2, "title": "Role fluidity: the unlabeled tool", "raw_title": "6.3 Role fluidity: the unlabeled tool", "parent": "sec-6", "part": "6", "html": "<p>Dedicated companion apps target the friendship and romance end\nexplicitly. Replika lets users select “virtual girlfriend or boyfriend,\nfriend, mentor”; Character.AI and Nomi foreground role-play and\nconnection. The app’s stated function is to occupy a companionship role,\nand the role is named up front.</p>\n<p>Chatbots serve the same companionship functions without naming\nthemselves companions, and that absence of explicit identification is\nexactly what makes them more fluid. Because a general assistant is not\nlocked to a companion label, it can slide between roles inside a single\nconversation: study buddy, then confidant, then advice-giver, then\nemotional support.</p>\n<p>The Thorn data in §2.3 shows young people already using them this way\n— romantic-feelings advice at 31%, help with something scary or\nconfusing at 31%, puberty and sexual health information at 26% — the\nsame person using the same tool across relational roles a human would\nkeep separate. The interface shifts from tutor to friend to therapist to\ncompanion with nothing declaring which role is active. The fluidity is\nnot a bug; it is what an unlabeled general assistant structurally\nis.</p>\n<p>The companion app wears one hat. The chatbot wears whichever hat the\nconversation calls for. The companionship function is present in both,\nbut only one is labelled — and regulating the labelled category leaves\nthe unlabeled, role-fluid tool, the one most young people actually use,\nuntouched.</p>\n", "refs": ["2.3"], "newFlags": 0, "words": 228, "people": []}, {"id": "sec-7", "num": "7", "level": 1, "title": "The regulatory object", "raw_title": "7. The regulatory object", "parent": null, "part": "7", "html": "<p>The function of companionship, not the product’s self-declared\nidentity, is what does the relational work. Function is therefore what\nregulation must track. This section tests that claim against the\ninstruments that exist.</p>\n", "refs": [], "newFlags": 0, "words": 34, "people": []}, {"id": "sec-7-1", "num": "7.1", "level": 2, "title": "What current instruments target", "raw_title": "7.1 What current instruments target", "parent": "sec-7", "part": "7", "html": "<p>Three recent US instruments take the categorical route, and one takes\nthe functional route. [NEW — this whole comparison is added; the draft\ndiscussed only the Youth AI Privacy Act.]</p>\n<p>California’s Companion Chatbots Act (S.B. 243), signed in October\n2025, requires non-human notifications, expressly prohibits chatbots\nfrom exposing minors to sexual content, and requires crisis-response\nprotocols for users showing suicidal ideation. Its object is the\ncompanion chatbot as a category.</p>\n<p>New York passed a law in November 2025 requiring chatbots to remind\nusers every three hours that they are not human.</p>\n<p>The Leading Ethical AI Development (LEAD) for Kids Act, which would\nhave banned emotionally manipulative chatbots for minors, was\nvetoed.</p>\n<p>Common Sense Media announced in April 2025 that social AI companions\npose an unacceptable risk to youth under 18, and its risk assessment of\nMeta AI found repeated failures to respond appropriately to teens\nexpressing thoughts of self-harm or suicide. Testifying before the\nSenate Judiciary Committee in September 2025, the former APA chief of\npsychology Mitch Prinstein described the unregulated spread of AI\ncompanions and chatbots as a “digital Wild West.”</p>\n<p>Read against §2.2, the categorical instruments reach Character AI,\nReplika, CHAI, Chub AI and Nomi — products used by 15%, 2%, 2%, 1% and\n1% of AI-using minors respectively. They do not reach the product used\nby 78%.</p>\n", "refs": ["2.2"], "newFlags": 1, "words": 225, "people": []}, {"id": "sec-7-2", "num": "7.2", "level": 2, "title": "The federal proposals", "raw_title": "7.2 The federal proposals", "parent": "sec-7", "part": "7", "html": "<p>Two federal instruments would regulate companion AI functionally, and\n<strong>neither has been enacted.</strong> Both were introduced in the\n119th Congress and neither has advanced: the <strong>Youth AI Privacy\nAct</strong> (S. 4199), introduced in the Senate by Senator Edward J.\nMarkey on 25 March 2026, and the <strong>People-First Chatbot\nAct</strong>, introduced in the House by Representative Valerie Foushee\nwith Representative Greg Casar in July 2026. Their status matters to the\nargument in §7.5 and should not be softened. Congress has passed no\ncomprehensive AI legislation; a proposed ten-year moratorium on state AI\nregulation passed the House and was rejected by the Senate 99–1; and by\nMarch 2026 some 1,561 AI bills had been introduced across 45 states. The\nfunctional drafting described here exists almost entirely at the level\nof proposal, while the law examined in §7.1 and §7.4 that has actually\nbeen enacted is state law. [NEW — this section is built from the\nintroduced bill texts and the underlying model bill; see the Sources\nview for handling.]</p>\n<h4 id=\"the-people-first-chatbot-act-began-as-model-legislation\">The\nPeople-First Chatbot Act began as model legislation</h4>\n<p>In January 2026 the Electronic Privacy Information Center, the\nConsumer Federation of America and Fairplay jointly developed the\n<strong>People-First Chatbot Bill</strong>, a model bill written for\nadoption by “local, state, federal, and international legislatures” and\ndrafted, its authors note, to withstand constitutional challenge by\ndrawing on language already enacted elsewhere. Its premise is that\nchatbots are products rather than people: it “does not outlaw chatbots”\nbut holds companies accountable for the harms their products cause.\nEPIC, the Consumer Federation and Fairplay are its co-developers, not\nits congressional sponsors — a distinction worth preserving.</p>\n<p>The model bill’s definition is the broadest in this corpus, and it\ncarries no exclusions at all:</p>\n<blockquote>\n<p>“Chatbot means any artificial intelligence, algorithmic, or automated\nsystem that generates information via text, audio, image, or video in a\nmanner that simulates interpersonal interactions or conversation.”\n(Voice: People-First Chatbot Act, US House)</p>\n</blockquote>\n<p>Three drafting choices deserve attention. There is no companion\ncategory and no carve-out for customer service, productivity or\neducation — the narrowing devices catalogued in §7.4 are simply absent.\n“User means any natural person, regardless of age,” which makes it one\nof the few instruments in this corpus not confined to minors (§8.6). And\nits notice requirement fires before the first output, every hour\nthereafter, “and each time a user prompts the chatbot about whether they\nare a real person” — a trigger that appears nowhere else in the corpus,\nand one that responds to the moment of actual uncertainty rather than to\nthe clock.</p>\n<p>Its safety provision delegates the substance. Section 4 requires a\nprovider to “assess its chatbot for risks of harm to users on a monthly\nbasis, according to metrics as set forth in rules promulgated by the\n[Attorney General or other appropriate entity],” and to publish\ninformation about the chatbot monthly. The mechanism is there; the\ncontent of the assessment is left to rulemaking that does not yet\nexist.</p>\n<h4\nid=\"the-introduced-bill-changed-the-definition-and-filled-in-the-harms\">The\nintroduced bill changed the definition and filled in the harms</h4>\n<p>The version Representative Foushee introduced defines an artificial\nintelligence chatbot as any interactive computer service or software\napplication that “generates responses that are not fully predetermined”\nand “accepts open-ended natural language or multimodal user input,”\nexcluding services “limited to contextualized replies” or “unable to\nrespond on a range of topics.” A further limb reaches systems that\nsimulate “a sustained interpersonal relationship or emotional\ninteraction” through persistent attachment or a “persistent identity,\npersona, or character.”</p>\n<p>That first formulation is, to within a few words, the definition used\nin the federal discussion draft discussed at §7.4 — which comes from the\nopposite side of the aisle. Two independent federal efforts converging\non the same functional test in the same session is the strongest\navailable evidence that a functional definition is writable. §3.4’s\nobjection, that defining empathic design in statute is extraordinarily\nhard, is answered less by argument than by the existence of two bills\nthat do it.</p>\n<p>More consequentially, the introduced bill <strong>defines the harms\nthe model bill left to rulemaking.</strong> Providers must assess their\nchatbots “not less frequently than monthly” for risks of “any covered\nharm, emotional dependence, or compulsive usage,” and each term is given\ncontent: a <strong>covered harm</strong> is “death, a suicide attempt,\nor a psychiatric emergency”; <strong>emotional dependence</strong>\nexists where a user “relies on an artificial intelligence chatbot as a\nprimary source” of support; and <strong>compulsive usage</strong> is\n“persistent and repetitive use” that significantly impacts “socializing,\nsleeping, eating, learning.” Where an unreasonable risk is identified\nfor a particular user, the provider “shall disable for that user any\nfeature or setting that creates an unreasonable risk.” Enforcement runs\nthrough the FTC, state attorneys general and a private right of action,\nwith statutory damages up to $250,000 for violations causing covered\nharm.</p>\n<p>This is the first instrument in this corpus to put a statutory\ndefinition on emotional dependence, and it is worth pausing on what it\ndoes. Four state bills prohibit “simulating emotional dependence”\nwithout saying what that is (§7.4). This bill defines dependence by the\nuser’s <em>relationship to the system</em> — reliance as a primary\nsource of support — rather than by the system’s design intent, and then\nrequires the provider to look for it monthly and switch off whatever is\nproducing it. That is regulation by measured effect rather than by\ndeclared purpose.</p>\n<p>One caveat on the narrative framing. The model bill’s claim about\ncompanion features is an intended effect rather than a prohibition:\nrestricting personal-data processing, it argues, will “significantly\nreduce the ability for chatbots to employ dangerous and manipulative\ncompanion-like features.” The word <em>companion</em> appears once in\nthe document, and not in an operative provision.</p>\n<h4\nid=\"the-youth-ai-privacy-act-takes-the-same-route-and-narrows-it-to-minors\">The\nYouth AI Privacy Act takes the same route and narrows it to minors</h4>\n<p>Senator Markey’s bill defines its object functionally and without\nexclusions:</p>\n<blockquote>\n<p>“A natural language interface that uses a covered algorithm to\nprovide adaptive responses to user inputs via text, audio, image, video,\nor any other mode of communication, simulating interpersonal\ninteraction.” (Voice: Youth AI Privacy Act, US Senate)</p>\n</blockquote>\n<p>A “covered algorithm” is “a computational process derived from\nmachine learning, natural language processing, neural networks, or other\ntechnology of similar or greater complexity,” and a minor is anyone\nunder 18. The definition contains no carve-outs and reaches every\ngeneral-purpose assistant in §5.</p>\n<p>Its provisions are more specific than any enacted instrument. It\nwould require clear, repeated notice to minors that the chatbot is not\nhuman. It would restrict memory: a deployer may not process personal\ndata to generate or personalise outputs unless the data was collected\nduring the current session and more recently than a maximum period to be\nset by the FTC. It would ban advertising to minors, prohibit training on\nminors’ personal data, prohibit profiling, and bar repurposing a minor’s\ninputs for anything other than producing an output or addressing safety\nissues. And it would require deployers to exclude a named list of\nengagement features: frequency-based rewards, push notifications, usage\nbadges, unprompted outputs, and “typing bubbles or indicators showing\nthat the AI chatbot is available.”</p>\n<p>Three of these matter more than their brevity suggests.</p>\n<p>The <strong>memory restriction</strong> is the only provision in this\ncorpus that substantively constrains persistent memory rather than\nmerely using it as a trigger (§7.4, §8.2). Session-scoping plus an\nFTC-set retention ceiling is precisely the limit the enacted statutes\nlack.</p>\n<p>The ban on <strong>unprompted outputs</strong> prohibits, as a design\nfeature, the very behaviour that New York’s Article 47 uses to\n<em>identify</em> a companion — “asking unprompted or unsolicited\nemotion-based questions” — and that Bernardi treats as definitional\n(§3.2). One instrument makes proactive emotional questioning the test\nfor regulation; the other bans it. Both are functional; they simply put\nthe same property to opposite work.</p>\n<p>The ban on <strong>typing indicators</strong> is the most granular\ndesign regulation in the corpus, and the most revealing. A typing bubble\ncarries no content. Its only function is to signal that something on the\nother side is composing a reply — anthropomorphic availability rendered\nas an interface element. A regime willing to regulate at that resolution\nhas accepted the premise of this paper: that the object of regulation is\na design property, not a product.</p>\n<h4 id=\"taken-together\">Taken together</h4>\n<p>The two proposals differ in chamber, in scope and in method. The\nHouse bill covers all users and regulates by monthly measurement of\ndefined harms. The Senate bill covers minors and prohibits specific\ndesign features outright. But they define their object in nearly the\nsame words, and neither uses “companion” to do it.</p>\n<p>Read against §7.4, the pattern is real: at federal level the drafting\nhas gone functional and broad, while the instruments that have actually\nbeen enacted are state instruments that adopt functional tests and then\nnarrow them back toward a product category through carve-outs.\n<strong>The gap this paper identifies is therefore not between what\nlegislators could do and what they have imagined — it is between what\nhas been drafted and what has been passed.</strong></p>\n", "refs": ["3.2", "3.4", "5", "7.1", "7.4", "7.5", "8.2", "8.6"], "newFlags": 1, "words": 1515, "people": ["pfca", "youthact"]}, {"id": "sec-7-3", "num": "7.3", "level": 2, "title": "The reactive backstop", "raw_title": "7.3 The reactive backstop", "parent": "sec-7", "part": "7", "html": "<p>Where legislation has not arrived, litigation has. In <em>Garcia v.\nCharacter Technologies</em> (M.D. Fla., 21 May 2025), Judge Anne Conway\nheld that Character.AI is a product for the purposes of product\nliability claims rather than a service, and declined to dismiss on First\nAmendment grounds — finding the protected-speech argument insufficient\nto end the case, without definitively resolving whether the interactions\nare protected speech. Claims for product liability, negligence, wrongful\ndeath, unjust enrichment and Florida consumer protection survived; the\nclaims against Alphabet and the intentional-infliction claim were\ndismissed. [NEW — verified against reporting of the order rather than\nthe order itself; read the order before characterising the holding in\nprint.]</p>\n<p>The significance is structural rather than doctrinal. Product\nliability reaches design, not product category: it asks what the system\ndid and whether the design was unreasonably dangerous, which is a\nfunctional inquiry conducted without any definition of “companion” at\nall. But it operates only after harm, and in this instance after a\ndeath. Litigation demonstrates that a functional standard is workable;\nit is not a substitute for one.</p>\n", "refs": [], "newFlags": 1, "words": 180, "people": []}, {"id": "sec-7-4", "num": "7.4", "level": 2, "title": "What the statutes actually say", "raw_title": "7.4 What the statutes actually say", "parent": "sec-7", "part": "7", "html": "<p>The definitions matter more than the labels, and reading them\noverturns an earlier reading of this section. Asking whether a bill\n“targets companion apps or general chatbots” conflates three separate\nquestions: the <strong>term</strong> the instrument uses, the\n<strong>test</strong> that determines what the term covers, and the\n<strong>carve-out</strong> that pulls things back out again. They do not\nline up. [NEW — this section is built from statutory text obtained\ndirectly; the visualisation panel records the source for each row and\nmarks the two that remain unverified.]</p>\n<p>Almost every instrument uses a companion-family term. Almost every\ninstrument then defines that term by what the system does. The\ncategorical thinking survives in the vocabulary and, decisively, in the\nexclusions.</p>\n<p><strong>New York</strong> (enacted) defines an “AI companion” as a\nsystem designed to simulate a sustained human or human-like relationship\nby three conjunctive means: retaining prior-interaction information and\npreferences “to personalize the interaction and facilitate ongoing\nengagement”; “asking unprompted or unsolicited emotion-based questions\nthat go beyond a direct response to a user prompt”; and “sustaining an\nongoing dialogue concerning matters personal to the user.” It then\nexcludes systems “primarily designed and <strong>marketed</strong> for\nefficiency improvements, research, or technical assistance.” This is a\nfunctional test with a self-presentation exemption attached — precisely\nthe vulnerability §5.4 identifies, in force. ChatGPT probably falls\noutside in any event, failing prong (ii): it does not ask unprompted\nemotion-based questions.</p>\n<p><strong>California</strong> (enacted) defines a “companion chatbot”\nas an AI system with a natural language interface providing “adaptive,\nhuman-like responses to user inputs” and “capable of meeting a user’s\nsocial needs, which includes exhibiting anthropomorphic features and\nsustaining a relationship across multiple interactions.” Its carve-out\nis use-based and gated on the word <em>only</em>: bots “used only for”\ncustomer service, business operations, productivity, internal research\nor technical assistance. ChatGPT is not used only for those things,\ngives adaptive human-like responses, and sustains a relationship across\ninteractions through memory. On the face of the text it is arguably\ninside the definition — the opposite of what a category-based reading\nassumes, and a point the paper should make explicitly.</p>\n<p><strong>Oregon</strong> (enacted) takes a design-purpose route rather\nthan a capability route: a system using AI or “algorithms that recognize\nemotion from input” that is “designed to simulate a sustained,\nhuman-like platonic, intimate or romantic relationship or companionship\nwith a user.” Its exclusions are use-based and broad, covering software\n“solely for the purpose of” customer service, patient care, education,\nfinancial services, business operations, productivity, information\nanalysis, internal research or technical assistance. This is closer to\nAndoh’s intent-based line than to Sun et al.’s feature list, and six\nother states have copied it.</p>\n<p><strong>Florida</strong> merges the two enacted approaches, taking\nCalifornia’s opening clause and New York’s three prongs and joining them\nwith “and” — producing a fourth distinct feature set. It uniquely\nexempts “artificial intelligence instructional tools”, which would carve\nout exactly the tutoring use Pew finds is the most common of all.</p>\n<p><strong>Missouri</strong> copies California’s definition and\nexclusions word for word, while attaching a far harsher operative rule:\nno minor access, and no humanlike avatars. Definitional text travels\nbetween states even where the policy does not.</p>\n<p><strong>Illinois</strong> is the most important instrument in the\ncorpus for this paper. S.B. 3262 defines a “companion artificial\nintelligence product” as a software application “capable of generating\nadaptive, personalized, and emotionally resonant responses to sustain a\ncoherent, long-term, one-on-one conversational relationship with a user,\n<strong>irrespective of how the system is marketed or labeled</strong>.”\nIt adds a rebuttable presumption: a product is presumed to be one “if it\nretains memory of past conversations with a specific user to inform\nfuture responses.” That is this paper’s thesis in statutory language,\nand it makes persistent memory the operative trigger for the whole\nregime.</p>\n<p><strong>The federal discussion draft</strong> nests the two\ncategories. It defines “artificial intelligence chatbot” broadly — a\nservice that “produces new expressive content or responses not fully\npredetermined by the developer” and “accepts open-ended natural-language\nor multimodal user input and produces adaptive or context-responsive\noutput” — which captures ChatGPT, Claude and Gemini unambiguously. “AI\ncompanion” is then a subset: an AI chatbot that provides adaptive\nhuman-like responses and “is designed to encourage or facilitate the\nsimulation of interpersonal or emotional interaction, friendship,\ncompanionship, or therapeutic communication.” This is Bernardi’s subset\nstructure from §3.2 used as drafting architecture, and it is the\ncleanest model available for the recommendation in §8.1. Note that the\ncompanion limb reaches “therapeutic communication”, and so covers the\ntherapist-like role of §4.2 directly.</p>\n<p><strong>The EU AI Act</strong> names no product at all. Article 5\nprohibits systems deploying “subliminal techniques beyond a person’s\nconsciousness or purposefully manipulative or deceptive techniques” with\nthe object or effect of “materially distorting the behaviour” of a\nperson, and systems that exploit vulnerabilities “due to their age,\ndisability or a specific social or economic situation.” It is the proof\nthat the regulatory object can be specified without a product category —\nat the cost that none of the companion-specific machinery follows from\nit.</p>\n<p><strong>The CHAT Act</strong> supplies the narrowest test in the\ncorpus, and a third way of reaching a categorical outcome from\nfunctional language. It defines a “companion AI chatbot” as “any\nsoftware-based artificial intelligence system or program that exists for\n<strong>the primary purpose of</strong> simulating interpersonal or\nemotional interaction, friendship, companionship, or therapeutic\ncommunication with a user.” There are no definitional exclusions and the\nAct needs none: the words <em>primary purpose</em> do the exclusionary\nwork inside the definition. ChatGPT’s primary purpose is not simulating\ncompanionship, so it falls outside by construction rather than by\ncarve-out.</p>\n<p>Set against the federal draft, this is the sharpest illustration in\nthe whole corpus that the reach of a statute sits in its gating language\nrather than its vocabulary. Both bills build the definition from the\nsame four limbs — interpersonal or emotional interaction, friendship,\ncompanionship, therapeutic communication. The CHAT Act gates them on\n“exists for the primary purpose of.” The draft’s Title V gates them on\n“is designed to encourage or facilitate the simulation of.” The first\nexcludes general assistants; the second arguably does not. One\nword-list, two verb phrases, opposite reach.</p>\n<p>There are therefore three distinct devices by which these instruments\nnarrow a functional test back down to something like a product category:\na <strong>marketing carve-out</strong> (New York), a <strong>use\ncarve-out</strong> (California, Oregon, Missouri, Florida), and a\n<strong>purpose-primacy gate</strong> (the CHAT Act). Illinois is the\nonly instrument that refuses all three. This is the finding the paper\nshould lead §7 with, because it identifies exactly where the\ndefinitional problem is doing its damage — not in the choice of term,\nbut in the qualifier.</p>\n<p>Two further pieces of evidence bear on whether these definitions\nreach general assistants. Virginia’s HB 635 — an Act titled the\n<em>Artificial Intelligence Chatbots Act</em> that regulates “companion\nchatbot” systems — has drawn industry comment asking for a safe harbour\ncovering “customer-service chatbots, educational tutors, productivity\nassistants”, on the argument that the definition is “currently broad\nenough to capture beneficial conversational AI systems.” Lobbying to add\na general-assistant exemption is evidence that one is currently absent.\nAnd the two federal accounts of the GUARD Act’s definition differ on\nwhether marketing forms part of the test, which is material here and\nshould be resolved against the introduced text before citing.</p>\n<p>The synthesis, and the paper’s upgraded thesis: <strong>the\ndefinitional problem is not that legislators use product categories\ninstead of functions. Most of them already use functions. It is that\neach picks a different feature set, nobody has noticed they are\nconverging on a single construct, and the carve-outs quietly reintroduce\nclassification by self-presentation.</strong> Five enacted or introduced\nstatutes, five constructs — and a functional definition of\ncompanionship, clearly stated, is what would let them converge.</p>\n", "refs": ["3.2", "4.2", "5.4", "7", "8.1"], "newFlags": 1, "words": 1324, "people": []}, {"id": "sec-7-5", "num": "7.5", "level": 2, "title": "Functionality, not product category", "raw_title": "7.5 Functionality, not product category", "parent": "sec-7", "part": "7", "html": "<p>The regulatory object should be the functionality, not the app. Three\narguments converge on this.</p>\n<p>From usage (§2.2): companion-specific rules framed around a product\ncategory miss the tools most young people actually use for\ncompanionship.</p>\n<p>From self-description (§5.4): companies self-classify inconsistently\nand their labels do not predict function, so a category defined by\nproduct identity is a category a developer can exit by rewriting\nmarketing copy.</p>\n<p>From role fluidity (§6.3): the unlabeled general assistant is\n<em>structurally</em> more able to move across companionship roles than\nthe labelled companion app, which means the regulatory gap is not\nincidental but inverted — the least-regulated tool is the most\nrelationally fluid.</p>\n<p>Two open questions this paper does not settle. First, which\nfunctional definition: Sun et al.’s four features, or McStay’s narrower\nemulated empathy, which has the advantage of an existing technical\nstandard behind it in IEEE 7014.1-2026. Second, whether a functional\ntest can be written tightly enough to survive drafting — the Youth AI\nPrivacy Act’s “simulating interpersonal interaction” is functional but\narguably reaches any conversational interface at all, which is a\ndefinitional problem of its own kind rather than a solution to this\none.</p>\n", "refs": ["2.2", "5.4", "6.3"], "newFlags": 0, "words": 201, "people": []}, {"id": "sec-8", "num": "8", "level": 1, "title": "Policy recommendations", "raw_title": "8. Policy recommendations", "parent": null, "part": "8", "html": "<p>These follow from the corpus rather than from first principles, and\neach is flagged for how far the evidence here actually carries it.</p>\n", "refs": [], "newFlags": 0, "words": 23, "people": []}, {"id": "sec-8-1", "num": "8.1", "level": 2, "title": "Agree on which function, and refuse to exempt by marketing", "raw_title": "8.1 Agree on which function, and refuse to exempt by marketing", "parent": "sec-8", "part": "8", "html": "<p>The paper’s thesis applied — restated, because §7.4 shows the first\nhalf of the argument is already largely won. A rule should fire on what\na system does, not on whether the product is marketed as a companion,\nand most instruments already work that way. The live problems are the\ndivergent feature sets and the carve-outs.</p>\n<p>Three concrete asks follow. Adopt
